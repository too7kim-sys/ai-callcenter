<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAQ 지식베이스 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  .controls {
    background: var(--c-surface);
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--c-border);
    position: sticky;
    top: 60px;
    z-index: 9;
  }
  .cats {
    display: flex;
    gap: 6px;
    margin-top: var(--space-3);
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .cat-btn {
    flex-shrink: 0;
    font-size: var(--text-xs);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--c-border-strong);
    background: var(--c-surface);
    color: var(--c-text-muted);
    cursor: pointer;
    font-weight: var(--fw-semibold);
    white-space: nowrap;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
  }
  .cat-btn:hover { background: var(--c-surface-alt); color: var(--c-text); }
  .cat-btn.active {
    background: var(--c-brand-700);
    color: #fff;
    border-color: var(--c-brand-700);
  }
  .stats { font-size: var(--text-xs); color: var(--c-text-muted); margin: var(--space-3) 0; }
  .faq-item {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-5);
    margin-bottom: var(--space-3);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .faq-item:hover { border-color: var(--c-border-strong); box-shadow: var(--shadow-sm); }
  .faq-item .head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .faq-item .id { font-size: var(--text-xs); color: var(--c-text-faint); font-weight: var(--fw-semibold); }
  .faq-item .q {
    font-size: var(--text-base);
    color: var(--c-text);
    font-weight: var(--fw-bold);
    line-height: var(--leading-tight);
  }
  .faq-item .q::before { content: "Q. "; color: var(--c-brand-700); }
  .faq-item .a {
    font-size: var(--text-base);
    color: var(--c-text-muted);
    line-height: var(--leading-base);
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 4px;
  }
  .faq-item .a::before { content: "A. "; color: var(--c-success); font-weight: var(--fw-bold); }
  .faq-item .kws {
    margin-top: var(--space-2);
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .kw {
    font-size: var(--text-xs);
    color: var(--c-text-muted);
    background: var(--c-surface-alt);
    padding: 2px 7px;
    border-radius: var(--radius-sm);
  }
  mark { background: var(--c-warning-bg); color: var(--c-warning); padding: 0 2px; border-radius: 3px; }
</style>
</head>
<body>
<header id="app-nav"></header>

<header class="page-header">
  <div>
    <div class="title">FAQ 지식베이스</div>
    <div class="subtitle">상담원 응대 참고용 · 키워드와 의미 기반 검색</div>
  </div>
  <div class="meta">
    <span class="chip chip-brand" id="count">·</span>
    <button class="btn btn-primary btn-sm hidden" id="add-btn">+ FAQ 추가</button>
  </div>
</header>

<div class="controls">
  <input class="input" id="search" placeholder="질문·답변·키워드로 검색하세요" autocomplete="off" />
  <div class="cats" id="cats"></div>
</div>

<div class="page-container">
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let allFaqs = [];
let activeCategory = "전체";
let searchText = "";

function highlight(text, query) {
  const safe = UI.escapeHtml(text);
  if (!query) return safe;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(escaped, "gi"), "<mark>$&</mark>");
}

async function init() {
  try {
    const res = await fetch("/api/faq");
    if (!res.ok) throw new Error();
    allFaqs = await res.json();
  } catch (e) {
    $("list").innerHTML = `<div class="empty-state"><div class="title">FAQ를 불러올 수 없습니다</div></div>`;
    return;
  }
  $("count").textContent = `${allFaqs.length}건`;
  renderCategories();
  render();
}

function renderCategories() {
  const counts = {};
  const ordered = [];
  const seen = new Set();
  allFaqs.forEach((f) => {
    counts[f.category] = (counts[f.category] || 0) + 1;
    if (!seen.has(f.category)) { seen.add(f.category); ordered.push(f.category); }
  });
  let html = `<button class="cat-btn active" data-cat="전체">전체 (${allFaqs.length})</button>`;
  ordered.forEach((cat) => {
    html += `<button class="cat-btn" data-cat="${UI.escapeHtml(cat)}">${UI.escapeHtml(cat)} (${counts[cat]})</button>`;
  });
  $("cats").innerHTML = html;
  $("cats").querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      activeCategory = b.dataset.cat;
      $("cats").querySelectorAll("button").forEach((x) => x.classList.toggle("active", x.dataset.cat === activeCategory));
      render();
    });
  });
}

function render() {
  const q = searchText.trim().toLowerCase();
  const filtered = allFaqs.filter((f) => {
    if (activeCategory !== "전체" && f.category !== activeCategory) return false;
    if (!q) return true;
    return (
      f.question.toLowerCase().includes(q) ||
      f.answer.toLowerCase().includes(q) ||
      (f.keywords || []).some((k) => k.toLowerCase().includes(q))
    );
  });
  const curated = allFaqs.filter((f) => f.source !== "learned").length;
  const learned = allFaqs.length - curated;
  $("stats").textContent =
    activeCategory === "전체" && !q
      ? `총 ${filtered.length}건 (큐레이션 ${curated} · 학습 ${learned})`
      : `필터 적용: ${filtered.length}건 / 전체 ${allFaqs.length}건 (큐레이션 ${curated} · 학습 ${learned})`;

  if (!filtered.length) {
    $("list").innerHTML = `<div class="empty-state"><div class="title">조건에 맞는 항목이 없습니다</div><div class="desc">검색어를 바꾸거나 카테고리 필터를 해제해 보세요.</div></div>`;
    return;
  }
  $("list").innerHTML = filtered.map((f) => {
    const kws = (f.keywords || []).map((k) => `<span class="kw">${UI.escapeHtml(k)}</span>`).join("");
    const learnedBadge = f.source === "learned"
      ? `<span class="chip chip-success">학습됨 · 상담 #${UI.escapeHtml(String(f.conversation_id || ""))}</span>`
      : "";
    // 큐레이션 항목 + faq.manage 권한이 있으면 수정/삭제 버튼 노출
    const canManage = canManageFaq && f.source === "curated";
    const actions = canManage
      ? `<div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn btn-secondary btn-xs" data-edit="${f.id}">수정</button>
          <button class="btn btn-danger btn-xs" data-del="${f.id}">삭제</button>
        </div>`
      : "";
    return `
      <div class="faq-item">
        <div class="head">
          <span class="chip chip-brand">${UI.escapeHtml(f.category)}</span>
          ${learnedBadge}
          <span class="id">#${UI.escapeHtml(String(f.id))}</span>
          ${actions}
        </div>
        <div class="q">${highlight(f.question, q)}</div>
        <div class="a">${highlight(f.answer, q)}</div>
        ${kws ? `<div class="kws">${kws}</div>` : ""}
      </div>`;
  }).join("");

  document.querySelectorAll("[data-edit]").forEach((b) => {
    b.addEventListener("click", () => editFaq(parseInt(b.dataset.edit, 10)));
  });
  document.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", () => deleteFaq(parseInt(b.dataset.del, 10)));
  });
}

let canManageFaq = false;

function existingCategories() {
  return [...new Set(allFaqs.map((f) => f.category))].filter(Boolean).sort();
}

async function addFaq() {
  const data = await UI.form({
    title: "FAQ 추가",
    description: "새 FAQ 항목을 등록합니다. 추가 즉시 검색·AI 응답에 반영됩니다.",
    fields: [
      { name: "category", label: "카테고리", value: "", required: true,
        placeholder: existingCategories().slice(0, 3).join(", ") + " 등" },
      { name: "question", label: "질문", type: "textarea", required: true, rows: 2 },
      { name: "answer",   label: "답변",   type: "textarea", required: true, rows: 4 },
      { name: "keywords", label: "키워드 (쉼표로 구분)", placeholder: "예: 배송, 도착, 며칠" },
    ],
    okText: "추가",
    wide: true,
  });
  if (!data) return;
  try {
    const res = await fetch("/api/faq", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        category: data.category.trim(),
        question: data.question.trim(),
        answer: data.answer.trim(),
        keywords: data.keywords.split(",").map((s) => s.trim()).filter(Boolean),
      }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("FAQ를 추가했습니다.", { type: "success" });
    await init();
  } catch (e) {
    UI.toast(e?.detail || "추가에 실패했습니다.", { type: "danger" });
  }
}

async function editFaq(id) {
  const f = allFaqs.find((x) => String(x.id) === String(id));
  if (!f) return;
  const data = await UI.form({
    title: "FAQ 수정",
    description: `#${f.id} 항목을 수정합니다.`,
    fields: [
      { name: "category", label: "카테고리", value: f.category || "", required: true },
      { name: "question", label: "질문", type: "textarea", value: f.question || "", required: true, rows: 2 },
      { name: "answer",   label: "답변",   type: "textarea", value: f.answer || "",   required: true, rows: 4 },
      { name: "keywords", label: "키워드 (쉼표로 구분)", value: (f.keywords || []).join(", ") },
    ],
    okText: "저장",
    wide: true,
  });
  if (!data) return;
  try {
    const res = await fetch(`/api/faq/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        category: data.category.trim(),
        question: data.question.trim(),
        answer: data.answer.trim(),
        keywords: data.keywords.split(",").map((s) => s.trim()).filter(Boolean),
      }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("수정했습니다.", { type: "success" });
    await init();
  } catch (e) {
    UI.toast(e?.detail || "수정에 실패했습니다.", { type: "danger" });
  }
}

async function deleteFaq(id) {
  const f = allFaqs.find((x) => String(x.id) === String(id));
  const ok = await UI.confirm(
    `FAQ #${id} 을(를) 삭제합니다.\n${f ? '"' + f.question + '"' : ""}\n이 작업은 되돌릴 수 없습니다.`,
    { title: "FAQ 삭제", okText: "삭제", danger: true }
  );
  if (!ok) return;
  try {
    const res = await fetch(`/api/faq/${id}`, { method: "DELETE" });
    if (!res.ok) throw await res.json();
    UI.toast("삭제했습니다.", { type: "success" });
    await init();
  } catch (e) {
    UI.toast(e?.detail || "삭제에 실패했습니다.", { type: "danger" });
  }
}

$("search").addEventListener("input", (e) => { searchText = e.target.value; render(); });
$("add-btn").addEventListener("click", addFaq);

document.addEventListener("auth-ready", (e) => {
  const user = e.detail;
  canManageFaq = user && (user.role === "admin" || (user.permissions || []).includes("faq.manage"));
  if (canManageFaq) $("add-btn").classList.remove("hidden");
  init();
});
</script>
</body>
</html>
