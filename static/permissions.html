<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>권한 관리 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  .role-card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    margin-bottom: var(--space-3);
    overflow: hidden;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .role-card:hover { border-color: var(--c-border-strong); box-shadow: var(--shadow-sm); }
  .role-head {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
  }
  .role-name { font-weight: var(--fw-bold); font-size: var(--text-md); }
  .role-desc { color: var(--c-text-muted); font-size: var(--text-sm); flex: 1; }
  .role-meta { color: var(--c-text-faint); font-size: var(--text-xs); }
  .role-body {
    border-top: 1px solid var(--c-border);
    padding: var(--space-4) var(--space-5);
    background: var(--c-surface-alt);
    display: none;
  }
  .role-body.open { display: block; animation: slide-up var(--transition-base); }
  .perm-group { margin-bottom: var(--space-4); }
  .perm-group:last-child { margin-bottom: 0; }
  .perm-group h4 {
    font-size: var(--text-xs);
    color: var(--c-text-muted);
    text-transform: uppercase;
    font-weight: var(--fw-bold);
    margin-bottom: 8px;
    letter-spacing: .06em;
  }
  .perm-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 6px 18px;
  }
  .perm-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 0;
  }
  .perm-item input[type=checkbox] {
    width: 16px;
    height: 16px;
    margin: 2px 0 0;
    cursor: pointer;
    accent-color: var(--c-brand-700);
  }
  .perm-item label { cursor: pointer; flex: 1; color: var(--c-text); font-size: var(--text-base); }
  .perm-item .key { font-size: var(--text-xs); color: var(--c-text-faint); font-family: var(--font-mono); margin-left: 4px; }
  .role-actions {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-4);
    justify-content: flex-end;
  }
  .new-form-row {
    display: grid;
    grid-template-columns: 1fr 2fr auto;
    gap: var(--space-2);
    align-items: flex-end;
  }
  @media (max-width: 720px) {
    .new-form-row { grid-template-columns: 1fr; }
  }
</style>
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<header id="app-nav"></header>

<header class="page-header">
  <div>
    <div class="title">권한 관리</div>
    <div class="subtitle">역할별로 권한을 설정하여 사용자 접근을 제어합니다.</div>
  </div>
  <div class="meta">
    <span class="chip" id="role-count">·</span>
  </div>
</header>

<div class="page-container">
  <section class="card" style="margin-bottom: var(--space-4)">
    <div class="card-head">
      <div class="title">신규 역할 추가</div>
      <div class="subtitle">추가 후 '권한 편집'에서 권한을 부여하세요.</div>
    </div>
    <div class="card-body">
      <div class="new-form-row">
        <div class="field" style="margin:0">
          <div class="label">역할 이름</div>
          <input class="input" id="new-name" placeholder="영문/숫자/._-" />
        </div>
        <div class="field" style="margin:0">
          <div class="label">설명 (선택)</div>
          <input class="input" id="new-desc" placeholder="역할 설명" />
        </div>
        <button class="btn btn-primary" id="create-btn">추가</button>
      </div>
    </div>
  </section>

  <div id="roles-list"></div>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let catalog = [];
let roles = [];

async function loadAll() {
  try {
    const [catRes, rolesRes] = await Promise.all([
      fetch("/api/roles/catalog"),
      fetch("/api/roles"),
    ]);
    if (!catRes.ok || !rolesRes.ok) throw new Error();
    catalog = await catRes.json();
    roles = await rolesRes.json();
    render();
  } catch (e) {
    $("roles-list").innerHTML = `<div class="empty-state"><div class="title">권한 정보를 불러올 수 없습니다</div></div>`;
  }
}

function permRowsForRole(role) {
  const groups = {};
  catalog.forEach((p) => { (groups[p.group] = groups[p.group] || []).push(p); });
  const checked = new Set(role.permissions || []);
  const editable = !role.all_permissions;
  return Object.entries(groups).map(([gname, perms]) => `
    <div class="perm-group">
      <h4>${UI.escapeHtml(gname)}</h4>
      <div class="perm-list">
        ${perms.map((p) => {
          const isChecked = role.all_permissions || checked.has(p.key);
          return `<div class="perm-item">
            <input type="checkbox" id="r${role.id}-${p.key}" data-key="${p.key}"
                   ${isChecked ? "checked" : ""} ${editable ? "" : "disabled"} />
            <label for="r${role.id}-${p.key}">${UI.escapeHtml(p.description)}<span class="key">${UI.escapeHtml(p.key)}</span></label>
          </div>`;
        }).join("")}
      </div>
    </div>
  `).join("");
}

function render() {
  $("role-count").textContent = `${roles.length}개 역할`;
  if (!roles.length) {
    $("roles-list").innerHTML = `<div class="empty-state"><div class="title">등록된 역할이 없습니다</div></div>`;
    return;
  }
  $("roles-list").innerHTML = roles.map((r) => {
    const chip = r.name === "admin"
      ? '<span class="chip chip-warning">관리자 · 전체 권한</span>'
      : r.is_system
        ? '<span class="chip chip-neutral">시스템</span>'
        : '<span class="chip chip-info">커스텀</span>';
    const permCount = r.all_permissions ? "전체" : (r.permissions || []).length;
    const editable = !r.all_permissions;
    return `
      <div class="role-card" data-role-id="${r.id}">
        <div class="role-head">
          <span class="role-name">${UI.escapeHtml(r.name)}</span>
          ${chip}
          <span class="role-desc">${UI.escapeHtml(r.description || "")}</span>
          <span class="role-meta">권한 ${permCount} · 사용자 ${r.user_count}명</span>
          <button class="btn btn-secondary btn-sm" data-toggle="${r.id}">${editable ? "권한 편집" : "권한 보기"}</button>
        </div>
        <div class="role-body" id="role-body-${r.id}">
          ${permRowsForRole(r)}
          <div class="role-actions">
            ${editable ? `<button class="btn btn-primary btn-sm" data-save="${r.id}">저장</button>` : ""}
            ${!r.is_system ? `<button class="btn btn-danger btn-sm" data-delete="${r.id}">역할 삭제</button>` : ""}
          </div>
        </div>
      </div>`;
  }).join("");

  document.querySelectorAll("[data-toggle]").forEach((b) => {
    b.addEventListener("click", () => $("role-body-" + b.dataset.toggle).classList.toggle("open"));
  });
  document.querySelectorAll("[data-save]").forEach((b) => {
    b.addEventListener("click", () => saveRole(parseInt(b.dataset.save, 10)));
  });
  document.querySelectorAll("[data-delete]").forEach((b) => {
    b.addEventListener("click", () => deleteRole(parseInt(b.dataset.delete, 10)));
  });
}

async function saveRole(id) {
  const body = $("role-body-" + id);
  const keys = [...body.querySelectorAll('input[type=checkbox]')]
    .filter((c) => c.checked && !c.disabled)
    .map((c) => c.dataset.key);
  try {
    const res = await fetch(`/api/roles/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ permissions: keys }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("권한을 저장했습니다.", { type: "success" });
    await loadAll();
  } catch (e) {
    UI.toast(e?.detail || "저장에 실패했습니다.", { type: "danger" });
  }
}

async function deleteRole(id) {
  const role = roles.find((r) => r.id === id);
  if (!role) return;
  const ok = await UI.confirm(
    `역할 '${role.name}' 을(를) 삭제합니다.\n사용 중인 사용자가 있으면 삭제할 수 없습니다.`,
    { title: "역할 삭제", okText: "삭제", danger: true }
  );
  if (!ok) return;
  try {
    const res = await fetch(`/api/roles/${id}`, { method: "DELETE" });
    if (!res.ok) throw await res.json();
    UI.toast("역할을 삭제했습니다.", { type: "success" });
    await loadAll();
  } catch (e) {
    UI.toast(e?.detail || "삭제에 실패했습니다.", { type: "danger" });
  }
}

async function createRole() {
  const name = $("new-name").value.trim();
  const description = $("new-desc").value.trim();
  if (!name) { UI.toast("역할 이름을 입력해 주세요.", { type: "warning" }); return; }
  const btn = $("create-btn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/roles", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, description, permissions: [] }),
    });
    if (!res.ok) throw await res.json();
    $("new-name").value = "";
    $("new-desc").value = "";
    UI.toast("역할을 추가했습니다. 권한 편집으로 권한을 부여하세요.", { type: "success" });
    await loadAll();
  } catch (e) {
    UI.toast(e?.detail || "추가에 실패했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false;
  }
}

$("create-btn").addEventListener("click", createRole);
document.addEventListener("auth-ready", loadAll);
</script>
</body>
</html>
