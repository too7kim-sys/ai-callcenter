<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>상담원 콘솔 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .work-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }

  /* ---------- 사이드바 (상담 목록) ---------- */
  .sidebar {
    width: 340px;
    background: var(--c-surface);
    border-right: 1px solid var(--c-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-head {
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--c-border);
    position: sticky;
    top: 0;
    background: var(--c-surface);
    z-index: 5;
  }
  .sidebar-head .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-2);
  }
  .sidebar-head .title { font-size: var(--text-sm); font-weight: var(--fw-bold); color: var(--c-text-muted); text-transform: uppercase; letter-spacing: .06em; }
  .sidebar-head .badges { display: flex; gap: 4px; align-items: center; }
  .sidebar-head .search-input {
    width: 100%;
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: 7px 11px;
    font-size: var(--text-base);
    background: var(--c-surface-alt);
    outline: none;
  }
  .sidebar-head .search-input:focus { border-color: var(--c-brand-700); background: #fff; }
  .sidebar-head .filters {
    display: flex;
    gap: 4px;
    margin-top: var(--space-2);
  }
  .sidebar-head .filters .f-chip {
    flex: 1;
    text-align: center;
    padding: 5px 0;
    font-size: 11px;
    font-weight: var(--fw-semibold);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    background: var(--c-surface);
    color: var(--c-text-muted);
    cursor: pointer;
    transition: background var(--transition-fast);
  }
  .sidebar-head .filters .f-chip:hover { background: var(--c-surface-alt); }
  .sidebar-head .filters .f-chip.on {
    background: var(--c-brand-700);
    color: #fff;
    border-color: var(--c-brand-700);
  }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv .agent-req { background: #fef3c7; color: #92400e; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: var(--fw-bold); }
  .conv .unread-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--c-danger);
    border-radius: 999px;
    margin-left: 5px;
  }
  .conv {
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--c-surface-alt);
    cursor: pointer;
    display: flex;
    gap: 11px;
    transition: background var(--transition-fast);
  }
  .conv:hover { background: var(--c-surface-alt); }
  .conv.active {
    background: var(--c-brand-50);
    box-shadow: inset 3px 0 0 var(--c-brand-700);
  }
  .conv .avatar {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: var(--c-brand-100);
    color: var(--c-brand-800);
    font-weight: var(--fw-bold);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: var(--text-md);
    text-transform: uppercase;
  }
  .conv .avatar.escalated { background: #fee2e2; color: #b91c1c; }
  .conv .body { flex: 1; min-width: 0; }
  .conv .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .conv .name { font-weight: var(--fw-bold); font-size: var(--text-base); color: var(--c-text); }
  .conv .when { font-size: var(--text-xs); color: var(--c-text-faint); flex-shrink: 0; }
  .conv .preview {
    font-size: var(--text-sm);
    color: var(--c-text-muted);
    margin: 3px 0 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv .meta-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .conv .conv-id { font-size: var(--text-xs); color: var(--c-text-faint); margin-left: auto; }
  .empty-list {
    padding: 40px 20px;
    text-align: center;
    color: var(--c-text-faint);
    font-size: var(--text-sm);
    line-height: var(--leading-base);
  }

  /* ---------- 본문 (선택된 상담 상세) ---------- */
  .detail { flex: 1; display: flex; overflow: hidden; min-width: 0; }
  .none {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--c-text-faint);
    background: var(--c-surface-alt);
    padding: var(--space-6);
  }
  .none .icon {
    width: 60px; height: 60px;
    border-radius: 999px;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--c-text-faint);
    margin-bottom: var(--space-4);
  }
  .none .icon svg { width: 28px; height: 28px; }
  .none .title { font-size: var(--text-md); font-weight: var(--fw-bold); color: var(--c-text); margin-bottom: 6px; }
  .none .desc { font-size: var(--text-sm); color: var(--c-text-muted); text-align: center; }
  .none .hint {
    margin-top: var(--space-5);
    font-size: var(--text-xs);
    color: var(--c-text-faint);
  }
  .none .hint kbd {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 10.5px;
  }

  .transcript-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--c-border);
    min-width: 0;
    background: var(--c-surface);
  }
  .pane-head {
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--c-border);
    background: var(--c-surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
  }
  .pane-head .info { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .pane-head .name { font-weight: var(--fw-bold); font-size: var(--text-md); }
  .pane-head .conv-id { color: var(--c-text-faint); font-size: var(--text-sm); }
  .pane-head .assign {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: var(--text-sm);
    color: var(--c-text-muted);
  }
  .pane-head .assign .who {
    background: var(--c-surface-alt);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-weight: var(--fw-semibold);
    color: var(--c-text);
  }
  .pane-head .actions { display: flex; gap: 4px; }
  .status-btns { display: flex; gap: 4px; }
  .status-btns .btn { padding: 5px 11px; font-size: var(--text-xs); font-weight: var(--fw-semibold); }
  .status-btns .btn.sel-open      { background: var(--c-brand-700); color: #fff; border-color: var(--c-brand-700); }
  .status-btns .btn.sel-escalated { background: var(--c-danger); color: #fff; border-color: var(--c-danger); }
  .status-btns .btn.sel-closed    { background: var(--c-text); color: #fff; border-color: var(--c-text); }

  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-4) var(--space-5);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    background: var(--c-surface-alt);
  }
  .msg { display: flex; gap: 8px; align-items: flex-end; max-width: 82%; }
  .msg.customer { align-self: flex-start; }
  .msg.ai, .msg.agent { align-self: flex-end; flex-direction: row-reverse; }
  .msg .av {
    width: 28px; height: 28px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 10px; font-weight: var(--fw-bold);
    color: var(--c-surface);
  }
  .msg.customer .av { background: #64748b; }
  .msg.ai .av { background: var(--c-info); }
  .msg.agent .av { background: var(--c-brand-700); }
  .msg .col { display: flex; flex-direction: column; min-width: 0; }
  .msg.customer .col { align-items: flex-start; }
  .msg.ai .col, .msg.agent .col { align-items: flex-end; }
  .msg .who { font-size: var(--text-xs); color: var(--c-text-muted); margin-bottom: 3px; font-weight: var(--fw-semibold); }
  .msg .bubble {
    padding: 8px 12px;
    border-radius: var(--radius-md);
    font-size: var(--text-base);
    line-height: var(--leading-base);
    white-space: pre-wrap;
    word-break: break-word;
    box-shadow: var(--shadow-xs);
  }
  .msg.customer .bubble { background: var(--c-surface); border: 1px solid var(--c-border); border-bottom-left-radius: 4px; }
  .msg.ai .bubble { background: var(--c-info-bg); border: 1px solid var(--c-info-border); color: var(--c-info); border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--c-brand-700); color: #fff; border-bottom-right-radius: 4px; }
  .msg .tag {
    font-size: var(--text-xs); margin-top: 3px;
    color: var(--c-text-faint);
  }

  .reply-box {
    border-top: 1px solid var(--c-border);
    padding: var(--space-3) var(--space-4);
    background: var(--c-surface);
  }
  .reply-box textarea {
    width: 100%;
    border: 1px solid var(--c-border-strong);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    font-size: var(--text-base);
    resize: none;
    min-height: 60px;
    font-family: inherit;
    outline: none;
    transition: border-color var(--transition-fast);
  }
  .reply-box textarea:focus { border-color: var(--c-brand-700); box-shadow: var(--shadow-focus); }
  .reply-box .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: var(--space-2);
  }
  .reply-box .row .hint { font-size: var(--text-xs); color: var(--c-text-faint); }
  .reply-box .toolbar {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .reply-box .toolbar .btn { font-size: 11px; padding: 3px 9px; }
  /* 메모/평가 카드 */
  .note-item {
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    background: var(--c-surface);
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .note-item .head {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--c-text-faint);
    margin-bottom: 3px;
  }
  .note-item .head b { color: var(--c-text-muted); font-weight: var(--fw-semibold); }
  .note-item .body { font-size: var(--text-sm); white-space: pre-wrap; word-break: break-word; line-height: 1.5; color: var(--c-text); }
  .note-item .del {
    background: none; border: none; cursor: pointer;
    color: var(--c-text-faint); font-size: 11px; padding: 0;
  }
  .note-item .del:hover { color: var(--c-danger); }
  .note-form textarea {
    width: 100%;
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    font-size: var(--text-sm);
    resize: vertical;
    min-height: 50px;
    font-family: inherit;
    outline: none;
  }
  .note-form textarea:focus { border-color: var(--c-brand-700); }
  .rating-display { display: flex; gap: 2px; font-size: 16px; color: #f59e0b; margin-bottom: 4px; }

  /* ---------- AI 패널 (오른쪽) ---------- */
  .ai-pane {
    width: 360px;
    background: var(--c-surface-alt);
    overflow-y: auto;
    flex-shrink: 0;
    padding: var(--space-4);
  }
  .ai-pane .card { margin-bottom: var(--space-3); }
  .ai-pane .card-head { padding: 12px 14px; }
  .ai-pane .card-head .title { font-size: var(--text-sm); color: var(--c-brand-700); font-weight: var(--fw-bold); }
  .ai-pane .card-head .src { font-size: 10px; color: var(--c-text-faint); font-weight: var(--fw-semibold); text-transform: uppercase; }
  .ai-pane .card-body { padding: 12px 14px; }
  .ai-pane .card-body p { font-size: var(--text-base); line-height: var(--leading-base); color: var(--c-text-muted); }
  .ai-pane .card-body ul { margin-left: var(--space-4); font-size: var(--text-sm); color: var(--c-text-muted); line-height: 1.7; }
  .ai-pane .muted { color: var(--c-text-faint); font-size: var(--text-sm); }
  .ai-pane .actions { display: flex; gap: 6px; margin-bottom: var(--space-3); }
  .ai-pane .actions .btn { flex: 1; }
  .ai-pane .row-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: var(--space-2); }
  .ai-pane .sent-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ai-pane .score { font-size: var(--text-xs); color: var(--c-text-faint); margin-left: auto; font-variant-numeric: tabular-nums; }
  .ai-pane .risk-warn {
    color: var(--c-danger);
    margin-top: 8px;
    font-weight: var(--fw-semibold);
    font-size: var(--text-sm);
    background: var(--c-danger-bg);
    border: 1px solid var(--c-danger-border);
    border-radius: var(--radius-sm);
    padding: 6px 9px;
  }
  .rec {
    border: 1px solid var(--c-border);
    border-radius: var(--radius-md);
    padding: 10px 11px;
    margin-bottom: 8px;
    background: var(--c-surface);
    transition: border-color var(--transition-fast);
  }
  .rec:hover { border-color: var(--c-border-strong); }
  .rec .rtitle { font-size: var(--text-sm); font-weight: var(--fw-bold); color: var(--c-text); }
  .rec .rans { font-size: var(--text-sm); color: var(--c-text-muted); line-height: var(--leading-base); margin: 5px 0; }
  .rec .rfoot { display: flex; justify-content: space-between; align-items: center; }
  .rec .conf { font-size: var(--text-xs); color: var(--c-text-faint); }
  .pw-input { margin-bottom: 8px; }

  /* ---------- 반응형 ---------- */
  @media (max-width: 980px) {
    .ai-pane { display: none; }
  }
  @media (max-width: 720px) {
    .work-area { flex-direction: column; }
    .sidebar { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--c-border); }
  }

  /* 인입 통화 모달 */
  .call-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,23,42,.55);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  .call-overlay.shown { display: flex; }
  .call-modal {
    background: #fff;
    border-radius: 14px;
    padding: 28px 32px;
    text-align: center;
    min-width: 320px; max-width: 90vw;
    box-shadow: 0 24px 60px rgba(15,23,42,.35);
  }
  .call-modal .icon { font-size: 48px; margin-bottom: 10px; }
  .call-modal .title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
  .call-modal .sub { font-size: 14px; color: #64748b; margin-bottom: 18px; }
  .call-modal button {
    border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 14px; font-weight: 600;
    cursor: pointer; color: #fff;
  }
  .call-modal .accept { background: #16a34a; margin-right: 8px; }
  .call-modal .reject { background: #ef4444; }
  .call-modal .hangup { background: #ef4444; }
  .call-modal .ringing-anim { animation: call-pulse 1.4s ease-in-out infinite; }
  @keyframes call-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }
</style>
<script src="/assets/pwa.js" defer></script>
<script src="/assets/webrtc.js"></script>
</head>
<body>
<header id="app-nav"></header>

<!-- 인입 통화 모달 (벨림 / 통화중) -->
<div id="call-overlay" class="call-overlay" role="dialog" aria-modal="true" aria-labelledby="call-title">
  <div class="call-modal">
    <div id="call-icon" class="icon ringing-anim">📞</div>
    <div id="call-title" class="title">인입 통화</div>
    <div id="call-sub" class="sub">고객</div>
    <div id="call-buttons">
      <button id="call-accept-btn" class="accept" type="button">✓ 받기</button>
      <button id="call-reject-btn" class="reject" type="button">✕ 거절</button>
    </div>
    <div id="call-active-btns" style="display:none;">
      <button id="call-hangup-btn-agent" class="hangup" type="button">☎ 끊기</button>
    </div>
  </div>
</div>

<div class="work-area">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="title-row">
        <div class="title">상담 목록</div>
        <div class="badges">
          <span class="chip" id="mode-badge" style="font-size:10px">·</span>
          <a class="chip" id="learn-badge" href="/knowledge" style="font-size:10px;text-decoration:none">학습 0</a>
        </div>
      </div>
      <input class="search-input" id="conv-search" placeholder="고객명·키워드로 필터…" autocomplete="off" />
      <div class="filters">
        <button class="f-chip on" data-filter="all">전체</button>
        <button class="f-chip" data-filter="mine">내 담당</button>
        <button class="f-chip" data-filter="unassigned">미배정</button>
      </div>
    </div>
    <div class="conv-list" id="conv-list"></div>
  </aside>

  <!-- 본문 -->
  <main class="detail" id="detail">
    <div class="none">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 11.5c0 4.7-4 8.5-9 8.5-1.4 0-2.7-.3-3.9-.8L3 21l1.3-4.5C3.5 15.2 3 13.4 3 11.5 3 6.8 7 3 12 3s9 3.8 9 8.5z" />
        </svg>
      </div>
      <div class="title">상담을 선택하세요</div>
      <div class="desc">왼쪽 목록에서 응대할 상담을 클릭하면 대화 내역과 AI 분석이 표시됩니다.</div>
      <div class="hint">검색은 <kbd>고객명</kbd> 또는 <kbd>키워드</kbd> 로 가능합니다.</div>
    </div>
  </main>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const API = "";
let activeId = null;
let activeConv = null;
let conversations = [];
let filterText = "";
let listFilter = "all";  // all | mine | unassigned
let listTimer = null;
let detailTimer = null;
let lastRenderedMsgIds = "";
let knownEscalatedIds = new Set();  // 이미 알림 보낸 에스컬레이션
let firstListLoad = true;
let allUsers = [];  // 배정용 사용자 목록
let templates = []; // 답변 템플릿

const STATUS_LABEL = { open: "진행중", escalated: "에스컬레이션", closed: "종료" };
const RISK_LABEL   = { low: "위험 낮음", medium: "위험 보통", high: "위험 높음" };
const WHO = { customer: "고객", ai: "AI 상담봇", agent: "상담원" };

function relTime(iso) {
  if (!iso) return "";
  try {
    const t = new Date(iso).getTime();
    const diff = (Date.now() - t) / 1000;
    if (diff < 60) return "방금 전";
    if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return ""; }
}

function initial(name) {
  if (!name) return "?";
  return name.trim().charAt(0).toUpperCase();
}

async function loadConfig() {
  try {
    const cfg = await (await fetch("/api/config")).json();
    const labels = { claude: "Claude", ollama: "Ollama", mock: "데모 모드" };
    const name = labels[cfg.ai_mode] || "데모 모드";
    $("mode-badge").textContent = cfg.ai_mode === "mock" ? name : `${name} · ${cfg.model}`;
  } catch (e) { $("mode-badge").textContent = "오프라인"; }
}

async function loadKnowledge() {
  try {
    const k = await (await fetch("/api/knowledge")).json();
    const mode = k.embeddings ? "의미" : "키워드";
    $("learn-badge").textContent = `학습 ${k.count} · ${mode}`;
  } catch (e) { /* 무시 */ }
}

async function loadList() {
  try {
    const params = new URLSearchParams();
    if (listFilter === "mine") params.set("mine", "1");
    else if (listFilter === "unassigned") params.set("unassigned", "1");
    const url = "/api/conversations" + (params.toString() ? "?" + params.toString() : "");
    const prev = new Set(conversations.filter((c) => c.status === "escalated").map((c) => c.id));
    conversations = await (await fetch(url)).json();
    if (!firstListLoad) {
      // 새로 에스컬레이션된 상담 알림
      conversations
        .filter((c) => c.status === "escalated" && !prev.has(c.id) && !knownEscalatedIds.has(c.id))
        .forEach((c) => {
          knownEscalatedIds.add(c.id);
          notifyEscalation(c);
        });
    } else {
      conversations.filter((c) => c.status === "escalated").forEach((c) => knownEscalatedIds.add(c.id));
      firstListLoad = false;
    }
    renderList();
  } catch (e) { /* 무시 */ }
}

async function loadUsers() {
  try {
    const res = await fetch("/api/users");
    if (res.ok) allUsers = await res.json();
  } catch (e) { /* 무시 */ }
}

async function loadTemplates() {
  try {
    const res = await fetch("/api/templates");
    if (res.ok) templates = await res.json();
  } catch (e) { /* 무시 */ }
}

// ===== 알림 (Web Notifications) =====
function ensureNotifyPermission() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") {
    Notification.requestPermission().catch(() => {});
  }
}
function notifyEscalation(conv) {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const n = new Notification("🚨 새 에스컬레이션 상담", {
      body: `${conv.customer_name || "고객"}: ${conv.last_message || ""}`,
      tag: `escalation-${conv.id}`,
    });
    n.onclick = () => { window.focus(); selectConversation(conv.id); n.close(); };
  } catch (e) { /* 무시 */ }
}

function renderList() {
  const box = $("conv-list");
  const f = filterText.trim().toLowerCase();
  const filtered = !f ? conversations : conversations.filter((c) =>
    (c.customer_name || "").toLowerCase().includes(f) ||
    (c.last_message || "").toLowerCase().includes(f) ||
    (c.summary || "").toLowerCase().includes(f) ||
    (c.category || "").toLowerCase().includes(f));

  if (!filtered.length) {
    box.innerHTML = `<div class="empty-list">${conversations.length ? "검색 결과가 없습니다." : "상담이 아직 없습니다."}</div>`;
    return;
  }
  box.innerHTML = filtered.map((c) => {
    const escalated = c.status === "escalated" || c.risk_level === "high";
    let chips = `<span class="chip ${c.status === "open" ? "chip-brand" : c.status === "escalated" ? "chip-danger" : "chip-neutral"}">${STATUS_LABEL[c.status] || c.status}</span>`;
    if (c.category) chips += `<span class="chip">${UI.escapeHtml(c.category)}</span>`;
    if (c.risk_level && c.risk_level !== "low") {
      const cls = c.risk_level === "high" ? "chip-danger" : "chip-warning";
      chips += `<span class="chip ${cls}">${RISK_LABEL[c.risk_level]}</span>`;
    }
    if (c.agent_requested) chips += `<span class="agent-req">🙋 연결요청</span>`;
    const me = window.appUser;
    if (me && c.assigned_agent_id === me.id) chips += `<span class="chip chip-success">내 담당</span>`;
    return `
      <div class="conv ${c.id === activeId ? "active" : ""}" data-id="${c.id}">
        <div class="avatar ${escalated ? "escalated" : ""}">${UI.escapeHtml(initial(c.customer_name))}</div>
        <div class="body">
          <div class="top">
            <span class="name">${UI.escapeHtml(c.customer_name || "고객")}${c.agent_requested ? '<span class="unread-dot"></span>' : ""}</span>
            <span class="when">${UI.escapeHtml(relTime(c.updated_at))}</span>
          </div>
          <div class="preview">${UI.escapeHtml(c.last_message || "메시지 없음")}</div>
          <div class="meta-row">${chips}<span class="conv-id">#${c.id}</span></div>
        </div>
      </div>`;
  }).join("");
  box.querySelectorAll("[data-id]").forEach((el) => {
    el.addEventListener("click", () => selectConversation(parseInt(el.dataset.id, 10)));
  });
}

async function selectConversation(id) {
  activeId = id;
  lastRenderedMsgIds = "";
  renderList();
  await loadDetail(true);
  // SSE 가 푸시로 갱신해주므로 폴링은 fallback (실패 시 30초 간격) 으로 늦춤
  if (detailTimer) clearInterval(detailTimer);
  detailTimer = setInterval(() => loadDetail(false), SSE_ACTIVE ? 30000 : 4000);
}

async function loadDetail(rebuild) {
  if (!activeId) return;
  let conv;
  try {
    conv = await (await fetch(`/api/conversations/${activeId}`)).json();
  } catch (e) { return; }
  activeConv = conv;
  if (rebuild) renderDetailShell(conv);
  renderAssignBar(conv);
  renderTranscript(conv);
  renderAnalysis(conv);
  renderFeedback(conv);
  loadNotes();
}

function renderAssignBar(conv) {
  const box = $("assign-bar");
  if (!box) return;
  const me = window.appUser;
  const whoTxt = conv.assigned_agent_name
    ? `담당 <span class="who">${UI.escapeHtml(conv.assigned_agent_name)}</span>`
    : `<span class="who" style="background:#fee2e2;color:#b91c1c">미배정</span>`;
  let btn = "";
  if (me) {
    if (conv.assigned_agent_id === me.id) {
      btn = `<button class="btn btn-secondary btn-xs" id="unassign-btn">담당 해제</button>`;
    } else {
      btn = `<button class="btn btn-secondary btn-xs" id="assign-me-btn">내가 담당</button>`;
    }
  }
  box.innerHTML = whoTxt + " " + btn;
  const a = $("assign-me-btn"); if (a) a.addEventListener("click", () => assign(window.appUser.id));
  const u = $("unassign-btn"); if (u) u.addEventListener("click", () => assign(null));
}

function renderFeedback(conv) {
  const card = $("card-feedback");
  if (!card) return;
  if (conv.customer_rating == null && !conv.customer_feedback) {
    card.style.display = "none";
    return;
  }
  card.style.display = "block";
  const stars = "★★★★★".substring(0, conv.customer_rating || 0) + "☆☆☆☆☆".substring(0, 5 - (conv.customer_rating || 0));
  card.innerHTML = `
    <div class="card-head"><div class="title">고객 만족도</div></div>
    <div class="card-body">
      <div class="rating-display">${stars}</div>
      ${conv.customer_feedback ? `<p style="font-size:var(--text-sm);color:var(--c-text-muted);white-space:pre-wrap">${UI.escapeHtml(conv.customer_feedback)}</p>` : `<p class="muted">의견 없음</p>`}
    </div>`;
}

async function assign(userId) {
  if (!activeId) return;
  try {
    const res = await fetch(`/api/conversations/${activeId}/assign`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId }),
    });
    if (!res.ok) throw await res.json();
    UI.toast(userId ? "담당으로 지정했습니다." : "담당을 해제했습니다.", { type: "success" });
    await loadDetail(false);
    loadList();
  } catch (e) {
    UI.toast(e?.detail || "배정 변경에 실패했습니다.", { type: "danger" });
  }
}

// ===== 메모 =====
async function loadNotes() {
  if (!activeId) return;
  let notes = [];
  try {
    notes = await (await fetch(`/api/conversations/${activeId}/notes`)).json();
  } catch (e) { return; }
  const box = $("notes-list");
  if (!box) return;
  if (!notes.length) {
    box.innerHTML = `<p class="muted" style="font-size:var(--text-sm)">아직 메모가 없습니다.</p>`;
    return;
  }
  const me = window.appUser;
  box.innerHTML = notes.map((n) => `
    <div class="note-item">
      <div class="head">
        <b>${UI.escapeHtml(n.author_name || "익명")}</b>
        <span>${UI.escapeHtml(relTime(n.created_at))}
          ${(me && (me.id === n.author_id || me.role === "admin")) ? `<button class="del" data-del="${n.id}">삭제</button>` : ""}
        </span>
      </div>
      <div class="body">${UI.escapeHtml(n.content)}</div>
    </div>`).join("");
  box.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", () => delNote(parseInt(b.dataset.del, 10)));
  });
}

async function addNote() {
  const ta = $("note-input");
  const text = ta.value.trim();
  if (!text) return;
  try {
    const res = await fetch(`/api/conversations/${activeId}/notes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text }),
    });
    if (!res.ok) throw await res.json();
    ta.value = "";
    await loadNotes();
  } catch (e) {
    UI.toast(e?.detail || "메모 저장에 실패했습니다.", { type: "danger" });
  }
}

async function delNote(noteId) {
  const ok = await UI.confirm("이 메모를 삭제합니다.", { okText: "삭제", danger: true });
  if (!ok) return;
  try {
    const res = await fetch(`/api/notes/${noteId}`, { method: "DELETE" });
    if (!res.ok) throw await res.json();
    await loadNotes();
  } catch (e) {
    UI.toast(e?.detail || "메모 삭제에 실패했습니다.", { type: "danger" });
  }
}

// ===== 템플릿 선택 =====
async function openTemplatePicker() {
  await loadTemplates();
  if (!templates.length) {
    UI.toast("등록된 템플릿이 없습니다. '답변 템플릿' 페이지에서 추가하세요.", { type: "info" });
    return;
  }
  // 카테고리별 그룹화
  const byCat = {};
  templates.forEach((t) => {
    const k = t.category || "기타";
    (byCat[k] = byCat[k] || []).push(t);
  });
  const html = Object.entries(byCat).map(([cat, list]) => `
    <div style="margin-bottom:10px">
      <div style="font-size:11px;font-weight:700;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px">${UI.escapeHtml(cat)}</div>
      ${list.map((t) => `
        <div class="rec tpl-pick-item" data-tpl="${t.id}" style="cursor:pointer">
          <div class="rtitle">${UI.escapeHtml(t.title)}</div>
          <div class="rans" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${UI.escapeHtml(t.content)}</div>
        </div>`).join("")}
    </div>`).join("");
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:center;justify-content:center";
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;width:520px;max-width:92%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,23,42,.35)">
      <div style="padding:14px 18px;border-bottom:1px solid var(--c-border);display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:700;font-size:15px">템플릿 선택</div>
        <button class="btn btn-secondary btn-xs" id="tpl-close">닫기</button>
      </div>
      <div style="padding:14px 18px;overflow-y:auto">${html}</div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelector("#tpl-close").addEventListener("click", close);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  overlay.querySelectorAll(".tpl-pick-item").forEach((el) => {
    el.addEventListener("click", () => {
      const t = templates.find((x) => x.id === parseInt(el.dataset.tpl, 10));
      if (t) {
        const ta = $("reply-text");
        ta.value = ta.value ? ta.value + "\n\n" + t.content : t.content;
        ta.focus();
      }
      close();
    });
  });
}

function renderStatusButtons(current) {
  const box = $("status-btns");
  if (!box) return;
  box.innerHTML = ["open", "escalated", "closed"].map((s) => {
    const cls = s === current ? `btn-secondary sel-${s}` : "btn-secondary";
    return `<button class="btn ${cls}" data-status="${s}">${STATUS_LABEL[s]}</button>`;
  }).join("");
  box.querySelectorAll("[data-status]").forEach((b) => {
    b.addEventListener("click", () => changeStatus(b.dataset.status));
  });
}

function renderTranscript(conv) {
  const box = $("transcript");
  if (!box) return;
  const ids = (conv.messages || []).map((m) => m.id).join(",");
  if (ids === lastRenderedMsgIds) { renderStatusButtons(conv.status); return; }
  lastRenderedMsgIds = ids;
  box.innerHTML = "";
  (conv.messages || []).forEach((m) => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    const av = m.role === "customer" ? "C" : (m.role === "ai" ? "AI" : "상");
    let tag = "";
    if (m.role === "customer" && m.sentiment) {
      tag = `<div class="tag">감정: ${UI.escapeHtml(m.sentiment)}</div>`;
    }
    div.innerHTML =
      `<div class="av">${av}</div>` +
      `<div class="col"><div class="who">${WHO[m.role] || m.role}</div>` +
      `<div class="bubble">${UI.escapeHtml(m.content)}</div>${tag}</div>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
  renderStatusButtons(conv.status);
}

function renderAnalysis(conv) {
  // 감정
  const cs = $("card-sentiment");
  if (cs) {
    if (conv.sentiment) {
      const risk = conv.risk_level || "low";
      const riskClass = { low: "chip-success", medium: "chip-warning", high: "chip-danger" }[risk] || "chip";
      cs.innerHTML = `
        <div class="card-head"><div class="title">감정 분석</div></div>
        <div class="card-body">
          <div class="sent-row">
            <span class="chip chip-brand">${UI.escapeHtml(conv.sentiment)}</span>
            <span class="chip ${riskClass}">${RISK_LABEL[risk]}</span>
            <span class="score">점수 ${conv.sentiment_score != null ? conv.sentiment_score : "-"}</span>
          </div>
          ${risk === "high" ? `<div class="risk-warn">⚠ 위험 상담 — 자동 에스컬레이션됨</div>` : ""}
        </div>`;
    } else {
      cs.innerHTML = `<div class="card-head"><div class="title">감정 분석</div></div><div class="card-body"><p class="muted">고객 메시지가 수신되면 자동 분석됩니다.</p></div>`;
    }
  }
  // 요약·분류
  const sm = $("card-summary");
  if (sm) {
    if (conv.summary) {
      const tags = (conv.tags || []).map((t) => `<span class="chip">${UI.escapeHtml(t)}</span>`).join("");
      const kp = (conv.key_points || []).map((k) => `<li>${UI.escapeHtml(k)}</li>`).join("");
      sm.innerHTML = `
        <div class="card-head"><div class="title">상담 요약·분류</div></div>
        <div class="card-body">
          <p>${UI.escapeHtml(conv.summary)}</p>
          <div class="row-tags">
            ${conv.category ? `<span class="chip chip-brand">${UI.escapeHtml(conv.category)}</span>` : ""}
            ${tags}
          </div>
          ${kp ? `<div style="margin-top:10px;font-size:var(--text-xs);color:var(--c-text-muted);font-weight:var(--fw-bold);text-transform:uppercase;letter-spacing:.05em">핵심 사항</div><ul>${kp}</ul>` : ""}
        </div>`;
    } else {
      sm.innerHTML = `<div class="card-head"><div class="title">상담 요약·분류</div></div><div class="card-body"><p class="muted">'AI 요약·분류' 를 눌러 분석하세요.</p></div>`;
    }
  }
}

async function runAnalyze() {
  const btn = $("btn-analyze");
  btn.disabled = true; btn.textContent = "분석 중…";
  try {
    const res = await fetch(`/api/conversations/${activeId}/analyze`, { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw data;
    renderAnalysis(data.conversation);
    loadList();
  } catch (e) {
    UI.toast(e?.detail || "분석 중 오류가 발생했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false; btn.textContent = "AI 요약·분류";
  }
}

async function runRecommend() {
  const btn = $("btn-recommend");
  btn.disabled = true; btn.textContent = "추천 생성 중…";
  try {
    const res = await fetch(`/api/conversations/${activeId}/recommend`, { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw data;
    renderRecommendations(data.recommendations || [], data.source, data.past_cases || []);
  } catch (e) {
    UI.toast(e?.detail || "추천 생성 중 오류가 발생했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false; btn.textContent = "답변 추천";
  }
}

function renderRecommendations(recs, source, pastCases) {
  const card = $("card-recommend");
  const SRC = { claude: "Claude", ollama: "Ollama", mock: "데모" };
  let html = `<div class="card-head"><div class="title">추천 답변</div><span class="src">${SRC[source] || "데모"}</span></div><div class="card-body">`;
  if (!recs.length) html += `<p class="muted">추천할 답변이 없습니다.</p>`;
  recs.forEach((r, i) => {
    html += `<div class="rec">
      <div class="rtitle">${UI.escapeHtml(r.title)}</div>
      <div class="rans">${UI.escapeHtml(r.answer)}</div>
      <div class="rfoot">
        <span class="conf">신뢰도 ${Math.round((r.confidence || 0) * 100)}%</span>
        <button class="btn btn-secondary btn-xs" data-idx="${i}">답변에 넣기</button>
      </div>
    </div>`;
  });
  if (pastCases && pastCases.length) {
    const m = pastCases[0].method === "embedding" ? "의미 검색" : "키워드 검색";
    html += `<div style="margin-top:12px;font-size:var(--text-xs);color:var(--c-text-muted);font-weight:var(--fw-bold);text-transform:uppercase;letter-spacing:.05em">참고한 과거 상담 (${m})</div>`;
    pastCases.forEach((c) => {
      html += `<div class="rec" style="background:var(--c-warning-bg);border-color:var(--c-warning-border)">
        <div class="rtitle">Q. ${UI.escapeHtml(c.question)}</div>
        <div class="rans">A. ${UI.escapeHtml(c.answer)}</div>
        <div class="conf">상담 #${c.conversation_id} · 유사도 ${c.score}</div>
      </div>`;
    });
  }
  html += `</div>`;
  card.innerHTML = html;
  card.querySelectorAll("button[data-idx]").forEach((b) => {
    b.addEventListener("click", () => {
      $("reply-text").value = recs[b.dataset.idx].answer;
      $("reply-text").focus();
    });
  });
}

async function sendReply() {
  const ta = $("reply-text");
  const text = ta.value.trim();
  if (!text) return;
  const btn = $("send-reply");
  btn.disabled = true;
  try {
    await fetch(`/api/conversations/${activeId}/reply`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    ta.value = "";
    await loadDetail(false);
    loadList();
  } catch (e) {
    UI.toast("답변 전송 중 오류가 발생했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false;
  }
}

async function changeStatus(status) {
  try {
    const res = await fetch(`/api/conversations/${activeId}/status`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    const conv = await res.json();
    renderStatusButtons(conv.status);
    loadList();
    loadKnowledge();
  } catch (e) {
    UI.toast("상태 변경 중 오류가 발생했습니다.", { type: "danger" });
  }
}

// ===== 비밀번호 재설정 지원 =====
async function verifyAccount() {
  const query = $("pw-query").value.trim();
  if (!query) return;
  const btn = $("pw-verify-btn");
  btn.disabled = true; btn.textContent = "확인 중…";
  try {
    const res = await fetch("/api/password/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    renderPwResult(await res.json());
  } catch (e) {
    UI.toast("계정 확인 중 오류가 발생했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false; btn.textContent = "계정 확인";
  }
}

function renderPwResult(data) {
  const box = $("pw-result");
  if (!data.found) {
    box.innerHTML = `<p class="muted" style="margin-top:10px;font-size:var(--text-sm)">일치하는 계정을 찾을 수 없습니다.</p>`;
    return;
  }
  const a = data.account;
  box.innerHTML = `
    <div style="background:var(--c-surface-alt);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:10px;margin-top:10px;font-size:var(--text-sm)">
      <div><b>${UI.escapeHtml(a.name)}</b> · ${UI.escapeHtml(a.username)}</div>
      <div style="color:var(--c-text-faint);font-size:var(--text-xs);margin-top:2px">${UI.escapeHtml(a.email_masked)}${a.phone_masked ? " · " + UI.escapeHtml(a.phone_masked) : ""}</div>
    </div>
    <button class="btn btn-primary btn-block" id="pw-send-btn" style="margin-top:10px">재설정 링크 발송</button>
    <div id="pw-send-result"></div>`;
  $("pw-send-btn").addEventListener("click", sendReset);
}

async function sendReset() {
  const query = $("pw-query").value.trim();
  if (!query) return;
  const btn = $("pw-send-btn");
  btn.disabled = true; btn.textContent = "발송 중…";
  try {
    const res = await fetch("/api/password/reset-request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const data = await res.json();
    const box = $("pw-send-result");
    if (!data.sent) {
      box.innerHTML = `<p class="muted" style="margin-top:8px;font-size:var(--text-sm)">${UI.escapeHtml(data.message)}</p>`;
      return;
    }
    let html = `<div style="background:var(--c-success-bg);border:1px solid var(--c-success-border);color:var(--c-success);border-radius:var(--radius-md);padding:9px;margin-top:9px;font-size:var(--text-sm);line-height:var(--leading-base);word-break:break-all">
      ${UI.escapeHtml(data.message)} (유효시간 ${data.expires_minutes}분)`;
    if (data.channel === "log" && data.reset_link) {
      html += `<br /><a href="${encodeURI(data.reset_link)}" target="_blank">${UI.escapeHtml(data.reset_link)}</a>`;
    }
    html += `</div>`;
    box.innerHTML = html;
  } catch (e) {
    UI.toast("재설정 링크 발송 중 오류가 발생했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false; btn.textContent = "재설정 링크 발송";
  }
}

// 부트스트랩
$("conv-search").addEventListener("input", (e) => { filterText = e.target.value; renderList(); });

async function bootstrap() {
  loadConfig();
  loadKnowledge();
  loadUsers();
  loadTemplates();
  ensureNotifyPermission();
  await loadList();
  const initConv = new URLSearchParams(location.search).get("conv");
  if (initConv) selectConversation(parseInt(initConv, 10));

document.addEventListener("auth-ready", bootstrap);

// --- SSE 실시간 구독 (failover 폴링은 SSE 가용 시 60초 간격으로 늦춤) ---
let SSE_ACTIVE = false;
let _sse = null;

// --- WebRTC 인입 통화 처리 ---
let _call = null;
let _activeCallId = null;
let _ringingCall = null;
let _callStartedAt = null;
let _callTimer = null;

function showIncomingCall(data) {
  // 이미 통화중이면 다른 벨림은 무시 (멀티 콜 미지원)
  if (_call || _ringingCall) return;
  _ringingCall = data;
  const overlay = $("call-overlay");
  overlay.classList.add("shown");
  $("call-icon").textContent = "📞";
  $("call-icon").classList.add("ringing-anim");
  $("call-title").textContent = "인입 통화";
  $("call-sub").textContent = `${data.customer_name || "고객"} (상담 #${data.conversation_id})`;
  $("call-buttons").style.display = "";
  $("call-active-btns").style.display = "none";

  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("📞 인입 통화", {
        body: data.customer_name || "고객",
        tag: "call-" + data.call_id,
      });
    } catch (e) { /* 일부 브라우저는 service worker 필요 */ }
  }
}

async function acceptCall() {
  if (!_ringingCall) return;
  const callData = _ringingCall;
  _ringingCall = null;
  try {
    const r = await fetch(`/api/calls/${callData.call_id}/answer`, { method: "POST" });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      UI.toast("받기 실패: " + (e.detail || r.status), { type: "danger" });
      $("call-overlay").classList.remove("shown");
      return;
    }
  } catch (e) {
    UI.toast("받기 중 오류: " + e.message, { type: "danger" });
    $("call-overlay").classList.remove("shown");
    return;
  }

  _activeCallId = callData.call_id;
  $("call-buttons").style.display = "none";
  $("call-active-btns").style.display = "";
  $("call-icon").textContent = "☎";
  $("call-icon").classList.remove("ringing-anim");
  $("call-title").textContent = "통화 중";
  $("call-sub").textContent = `${callData.customer_name || "고객"} · 연결 중…`;

  // 상담원은 callee — offer 가 도착하면 WebRTC 시작 (handleSignal 안에서)
  // 미리 PeerConnection 만 만들어 둠 (isCaller=false → offer 안 만듦)
  _call = new CallClient({
    role: "agent",
    callId: _activeCallId,
    conversationId: callData.conversation_id,
    onState: (s) => {
      if (s === "connected") {
        _callStartedAt = Date.now();
        const sub = $("call-sub");
        if (_callTimer) clearInterval(_callTimer);
        _callTimer = setInterval(() => {
          const sec = Math.floor((Date.now() - _callStartedAt) / 1000);
          sub.textContent = `${callData.customer_name || "고객"} · ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;
        }, 1000);
      } else if (s === "ended") {
        // 멱등 — call_ended SSE 와 onState 양쪽에서 호출돼도 한 번만 처리
        endCallUi({ duration_seconds: _callStartedAt ? Math.floor((Date.now() - _callStartedAt) / 1000) : 0 });
      }
    },
    onError: (e) => UI.toast("통화 오류: " + e.message, { type: "danger" }),
  });
  try {
    await _call.start({ isCaller: false });
  } catch (e) {
    endCallUi({ reason: "mic_denied" });
  }
}

async function rejectCall() {
  if (!_ringingCall) return;
  const id = _ringingCall.call_id;
  _ringingCall = null;
  $("call-overlay").classList.remove("shown");
  try { await fetch(`/api/calls/${id}/reject`, { method: "POST" }); } catch (e) {}
}

async function hangupCall() {
  if (_call) {
    await _call.hangup();
  } else if (_activeCallId) {
    try { await fetch(`/api/calls/${_activeCallId}/end`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reason: "agent_hangup" }),
    }); } catch (e) {}
    endCallUi({});
  }
}

function endCallUi(data) {
  // 멱등 — 이미 정리됐으면 무시
  if (!_call && !_activeCallId && !_ringingCall && !_callTimer) return;
  const wasActive = !!_activeCallId;
  if (_callTimer) { clearInterval(_callTimer); _callTimer = null; }
  if (_call) { try { _call.cleanup(); } catch (e) {} }
  _call = null; _ringingCall = null; _activeCallId = null; _callStartedAt = null;
  $("call-overlay").classList.remove("shown");
  if (wasActive && data && data.duration_seconds > 0) {
    UI.toast(`통화 종료 (${Math.floor(data.duration_seconds/60)}분 ${data.duration_seconds%60}초)`, { type: "info" });
  }
}

$("call-accept-btn").addEventListener("click", acceptCall);
$("call-reject-btn").addEventListener("click", rejectCall);
$("call-hangup-btn-agent").addEventListener("click", hangupCall);


function startSse() {
  if (typeof EventSource === "undefined") return;
  try {
    _sse = new EventSource("/api/events/stream");
    _sse.addEventListener("open", () => {
      SSE_ACTIVE = true;
      if (listTimer) clearInterval(listTimer);
      listTimer = setInterval(loadList, 60000);  // SSE 살아 있는 동안은 안전망만
    });
    const refresh = (e) => {
      let payload = {};
      try { payload = JSON.parse(e.data || "{}"); } catch (_) {}
      // 목록은 모든 이벤트에서 갱신 (에스컬레이션·새 상담 즉시 반영)
      loadList();
      // 현재 보고 있는 상담의 이벤트면 상세도 즉시 갱신
      if (activeId && payload.conversation_id === activeId) {
        loadDetail(false);
      }
    };
    _sse.addEventListener("conversation_created", refresh);
    _sse.addEventListener("conversation_updated", refresh);
    _sse.addEventListener("message_created", refresh);
    _sse.addEventListener("call_requested", (e) => {
      const data = JSON.parse(e.data || "{}");
      showIncomingCall(data);
    });
    _sse.addEventListener("call_signal", (e) => {
      const data = JSON.parse(e.data || "{}");
      if (_call) _call.handleSignal(data);
    });
    _sse.addEventListener("call_ended", (e) => {
      const data = JSON.parse(e.data || "{}");
      if (data.call_id === _activeCallId) endCallUi(data);
    });
    _sse.addEventListener("error", () => {
      // 연결 끊김 — EventSource 가 자동 재시도. 그동안 폴링 빠르게 복귀
      SSE_ACTIVE = false;
      if (listTimer) clearInterval(listTimer);
      listTimer = setInterval(loadList, 5000);
    });
  } catch (e) { /* SSE 미지원 — 기본 폴링 유지 */ }
}

listTimer = setInterval(loadList, 5000);  // SSE 연결 전까지 폴링 유지
startSse();
</script>
