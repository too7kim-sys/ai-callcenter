<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>대시보드 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-5);
  }
  .stat-card .num {
    font-size: var(--text-3xl);
    font-weight: var(--fw-bold);
    color: var(--c-text);
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label {
    font-size: var(--text-xs);
    color: var(--c-text-muted);
    text-transform: uppercase;
    font-weight: var(--fw-semibold);
    letter-spacing: .04em;
  }
  .stat-card .sub { font-size: var(--text-xs); color: var(--c-text-faint); margin-top: 6px; }
  .stat-card.success .num { color: var(--c-success); }
  .stat-card.danger .num { color: var(--c-danger); }
  .stat-card.warning .num { color: var(--c-warning); }
  .stat-card.brand .num { color: var(--c-brand-700); }

  .bar-row {
    display: grid;
    grid-template-columns: 120px 1fr 50px;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
    font-size: var(--text-sm);
  }
  .bar-row .name { color: var(--c-text-muted); }
  .bar-row .bar {
    height: 8px;
    background: var(--c-surface-alt);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-row .bar > div { height: 100%; background: var(--c-brand-700); border-radius: inherit; transition: width .3s ease; }
  .bar-row.success .bar > div { background: var(--c-success); }
  .bar-row.warning .bar > div { background: var(--c-warning); }
  .bar-row.danger .bar > div { background: var(--c-danger); }
  .bar-row .v { text-align: right; color: var(--c-text); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }

  .top-cat {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--c-surface-alt);
    font-size: var(--text-base);
  }
  .top-cat:last-child { border-bottom: none; }

  /* KPI */
  .kpi-card .num    { font-size: var(--text-3xl); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
  .kpi-card .label  { font-size: var(--text-xs); color: var(--c-text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: var(--fw-semibold); }
  .kpi-card .sub    { font-size: var(--text-xs); color: var(--c-text-faint); margin-top: 6px; }
  .kpi-card.good .num    { color: var(--c-success); }
  .kpi-card.warn .num    { color: var(--c-warning); }
  .kpi-card.bad  .num    { color: var(--c-danger); }
  .kpi-card.muted .num   { color: var(--c-text-muted); }

  .trend-chart { width: 100%; height: 200px; }
  .trend-chart .axis    { stroke: var(--c-surface-alt); stroke-width: 1; }
  .trend-chart .grid    { stroke: var(--c-surface-alt); stroke-width: 1; stroke-dasharray: 3 3; }
  .trend-chart .area-c  { fill: var(--c-brand-700); fill-opacity: .08; }
  .trend-chart .line-c  { stroke: var(--c-brand-700); stroke-width: 2; fill: none; }
  .trend-chart .dot-c   { fill: var(--c-brand-700); }
  .trend-chart .axis-text { font-size: 10px; fill: var(--c-text-muted); }

  /* 상담원 리더보드 */
  .agents-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .agents-table th, .agents-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--c-surface-alt);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .agents-table th { color: var(--c-text-muted); font-weight: var(--fw-semibold);
    text-transform: uppercase; font-size: var(--text-xs); letter-spacing: .04em; }
  .agents-table th:first-child, .agents-table td:first-child { text-align: left; }
  .agents-table tr:hover { background: var(--c-surface-alt); }
  .agent-name { font-weight: var(--fw-semibold); color: var(--c-text); }
  .agent-username { color: var(--c-text-faint); font-size: var(--text-xs); }
  .agent-inactive { color: var(--c-text-faint); }
  .rank { color: var(--c-text-faint); font-weight: var(--fw-bold); width: 28px; }
  .csat-good { color: var(--c-success); }
  .csat-bad { color: var(--c-danger); }
  .esc-high { color: var(--c-danger); }
  .period-toggle { display: flex; gap: 4px; }
  .period-toggle button {
    padding: 4px 12px; font-size: var(--text-xs); border-radius: 6px;
    border: 1px solid var(--c-surface-alt); background: transparent; cursor: pointer;
    color: var(--c-text-muted);
  }
  .period-toggle button.active { background: var(--c-brand-700); color: white; border-color: var(--c-brand-700); }

  /* 시간대 히트맵 */
  .heatmap-wrap { overflow-x: auto; }
  .heatmap { font-size: 11px; color: var(--c-text-muted); }
  .heatmap .cell { stroke: #fff; stroke-width: 1.5; cursor: pointer; }
  .heatmap .cell:hover { stroke: var(--c-text); stroke-width: 2; }
  .heatmap .label { font-size: 10px; fill: var(--c-text-muted); }
  .heatmap-legend {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: var(--c-text-muted);
    margin-top: 8px;
  }
  .heatmap-legend .gradient {
    flex: 1; max-width: 160px; height: 10px; border-radius: 4px;
    background: linear-gradient(90deg, #f1f5f9 0%, #1d4ed8 100%);
  }
</style>
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<header id="app-nav"></header>

<header class="page-header">
  <div>
    <div class="title">대시보드</div>
    <div class="subtitle">콜센터 현황을 한눈에</div>
  </div>
  <div class="meta">
    <a class="btn btn-secondary btn-sm hidden" id="export-btn" href="/api/export/conversations.csv" download>상담 CSV</a>
    <button class="btn btn-secondary btn-sm" id="refresh-btn">새로고침</button>
  </div>
</header>

<div class="page-container">
  <!-- 상단 큰 숫자 카드 -->
  <div class="grid" id="top-grid"></div>

  <!-- KPI 카드 + 7일 추이 -->
  <div class="grid" id="kpi-grid"></div>
  <section class="card" style="margin-bottom: var(--space-5);">
    <div class="card-head">
      <div class="title">최근 7일 상담 추이</div>
      <div class="sub" id="trend-meta" style="font-size: var(--text-xs); color: var(--c-text-muted);"></div>
    </div>
    <div class="card-body">
      <svg class="trend-chart" id="trend-chart" viewBox="0 0 700 200" preserveAspectRatio="none" aria-label="일별 상담 건수 추이"></svg>
    </div>
  </section>

  <!-- 시간대 히트맵 (요일 × 시간) -->
  <section class="card" style="margin-bottom: var(--space-5);">
    <div class="card-head">
      <div class="title">시간대 트래픽 (KST · 최근 28일)</div>
      <div class="sub" id="heatmap-meta" style="font-size: var(--text-xs); color: var(--c-text-muted);"></div>
    </div>
    <div class="card-body heatmap-wrap">
      <svg class="heatmap" id="heatmap" viewBox="0 0 760 200" preserveAspectRatio="xMinYMid meet" aria-label="요일×시간 상담 건수 히트맵"></svg>
      <div class="heatmap-legend">
        <span>적음</span>
        <div class="gradient"></div>
        <span id="heatmap-max">많음</span>
      </div>
    </div>
  </section>

  <!-- 상담원 성과 리더보드 -->
  <section class="card" style="margin-bottom: var(--space-5);">
    <div class="card-head">
      <div class="title">상담원 성과</div>
      <div class="period-toggle" id="agents-period">
        <button data-days="7">7일</button>
        <button data-days="30" class="active">30일</button>
        <button data-days="90">90일</button>
      </div>
    </div>
    <div class="card-body" id="agents-body">
      <p class="muted">불러오는 중…</p>
    </div>
  </section>

  <!-- 분포 카드들 -->
  <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));">
    <section class="card">
      <div class="card-head"><div class="title">상태 분포</div></div>
      <div class="card-body" id="status-dist"></div>
    </section>
    <section class="card">
      <div class="card-head"><div class="title">감정 분포</div></div>
      <div class="card-body" id="sentiment-dist"></div>
    </section>
    <section class="card">
      <div class="card-head"><div class="title">상위 카테고리</div></div>
      <div class="card-body" id="top-cats"></div>
    </section>
    <section class="card">
      <div class="card-head"><div class="title">위험도</div></div>
      <div class="card-body" id="risk-dist"></div>
    </section>
  </div>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);

async function load() {
  let d;
  try {
    d = await (await fetch("/api/dashboard")).json();
  } catch (e) {
    UI.toast("대시보드 데이터를 불러오지 못했습니다.", { type: "danger" });
    return;
  }

  const cards = [
    { label: "오늘 신규 상담", num: d.today.new_conversations, sub: `오늘 메시지 ${d.today.messages}건` },
    { label: "내 담당 상담", num: d.me.assigned, sub: `미배정 대기 ${d.me.unassigned_queue}건`, cls: "brand" },
    { label: "총 상담 수", num: d.totals.conversations, sub: `학습 ${d.totals.learned_items}건` },
    { label: "활성 사용자", num: d.totals.active_users, sub: "콜센터 로그인 계정" },
    { label: "고객 만족도", num: d.satisfaction.avg != null ? d.satisfaction.avg : "—",
      sub: d.satisfaction.count ? `${d.satisfaction.count}건 평가` : "평가 없음",
      cls: d.satisfaction.avg && d.satisfaction.avg >= 4 ? "success" : "" },
  ];
  $("top-grid").innerHTML = cards.map((c) => `
    <div class="card stat-card ${c.cls || ''}">
      <div class="card-body">
        <div class="label">${UI.escapeHtml(c.label)}</div>
        <div class="num">${UI.escapeHtml(String(c.num))}</div>
        <div class="sub">${UI.escapeHtml(c.sub || '')}</div>
      </div>
    </div>`).join("");

  const STATUS_LABELS = { open: "진행중", escalated: "에스컬레이션", closed: "종료" };
  const STATUS_CLASS  = { open: "", escalated: "danger", closed: "success" };
  $("status-dist").innerHTML = renderBars(d.by_status, STATUS_LABELS, STATUS_CLASS);

  $("sentiment-dist").innerHTML = renderBars(d.by_sentiment);

  const RISK_LABELS = { low: "낮음", medium: "보통", high: "높음" };
  const RISK_CLASS = { low: "success", medium: "warning", high: "danger" };
  $("risk-dist").innerHTML = renderBars(d.by_risk, RISK_LABELS, RISK_CLASS);

  if (d.top_categories.length) {
    $("top-cats").innerHTML = d.top_categories.map((c) =>
      `<div class="top-cat"><span>${UI.escapeHtml(c.name)}</span><b>${c.count}</b></div>`
    ).join("");
  } else {
    $("top-cats").innerHTML = `<p class="muted">아직 카테고리 분류 데이터가 없습니다.</p>`;
  }
}

function renderBars(data, labels = {}, classes = {}) {
  const entries = Object.entries(data || {});
  const max = Math.max(1, ...entries.map(([, n]) => n));
  if (!entries.length) return `<p class="muted">데이터 없음</p>`;
  return entries
    .sort((a, b) => b[1] - a[1])
    .map(([key, n]) => {
      const label = labels[key] || key;
      const cls = classes[key] || "";
      const pct = Math.round((n / max) * 100);
      return `<div class="bar-row ${cls}">
        <span class="name">${UI.escapeHtml(label)}</span>
        <div class="bar"><div style="width:${pct}%"></div></div>
        <span class="v">${n}</span>
      </div>`;
    }).join("");
}

// --- KPI (AHT / FRT / FCR / 에스컬레이션율) + 7일 추이 ---
function fmtDuration(secs) {
  if (secs == null) return "—";
  if (secs < 60) return `${secs}초`;
  if (secs < 3600) return `${Math.floor(secs / 60)}분 ${secs % 60}초`;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  return `${h}시간 ${m}분`;
}
function fmtPct(rate) {
  return rate == null ? "—" : `${Math.round(rate * 100)}%`;
}
function tone(condition, good, bad) {
  return condition == null ? "muted" : (condition ? good : bad);
}

async function loadKpi() {
  let k;
  try { k = await (await fetch("/api/dashboard/kpi?days=7")).json(); }
  catch (e) { return; }

  const cards = [
    {
      label: "평균 처리 시간 (AHT)", num: fmtDuration(k.aht_seconds),
      sub: `종료 ${k.sample_size_closed}건`,
      cls: tone(k.aht_seconds != null && k.aht_seconds < 600, "good", "warn"),
    },
    {
      label: "평균 첫응답 시간 (FRT)", num: fmtDuration(k.frt_seconds),
      sub: "고객 메시지 → 첫 응답",
      cls: tone(k.frt_seconds != null && k.frt_seconds < 60, "good", "warn"),
    },
    {
      label: "1차 해결률 (FCR)", num: fmtPct(k.fcr_rate),
      sub: "에스컬레이션 없이 종료",
      cls: tone(k.fcr_rate != null && k.fcr_rate >= 0.7, "good", "bad"),
    },
    {
      label: "에스컬레이션율", num: fmtPct(k.escalation_rate),
      sub: `전체 ${k.sample_size_total}건 중`,
      cls: tone(k.escalation_rate != null && k.escalation_rate < 0.2, "good", "bad"),
    },
  ];
  $("kpi-grid").innerHTML = cards.map((c) => `
    <div class="card kpi-card ${c.cls}">
      <div class="card-body">
        <div class="label">${UI.escapeHtml(c.label)}</div>
        <div class="num">${UI.escapeHtml(String(c.num))}</div>
        <div class="sub">${UI.escapeHtml(c.sub || '')}</div>
      </div>
    </div>`).join("");

  renderTrendChart(k.trend);
  $("trend-meta").textContent =
    `최근 ${k.window_days}일 · 전체 ${k.sample_size_total}건 · 종료 ${k.sample_size_closed}건`;
}

function renderTrendChart(trend) {
  const svg = $("trend-chart");
  if (!trend || !trend.length) {
    svg.innerHTML = `<text x="350" y="100" text-anchor="middle" class="axis-text">데이터 없음</text>`;
    return;
  }
  const W = 700, H = 200, PAD_L = 36, PAD_R = 12, PAD_T = 12, PAD_B = 28;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
  const maxY = Math.max(1, ...trend.map((d) => d.conversations));
  const stepX = trend.length > 1 ? innerW / (trend.length - 1) : 0;

  const x = (i) => PAD_L + i * stepX;
  const y = (v) => PAD_T + innerH - (v / maxY) * innerH;

  const linePts = trend.map((d, i) => `${x(i)},${y(d.conversations)}`).join(" ");
  const areaPts = `${PAD_L},${PAD_T + innerH} ${linePts} ${x(trend.length - 1)},${PAD_T + innerH}`;

  // Y 축 눈금 (0, max/2, max)
  const yTicks = [0, Math.round(maxY / 2), maxY].filter((v, i, a) => a.indexOf(v) === i);

  let html = "";
  // 그리드 + Y 라벨
  yTicks.forEach((v) => {
    const yy = y(v);
    html += `<line class="grid" x1="${PAD_L}" y1="${yy}" x2="${W - PAD_R}" y2="${yy}" />`;
    html += `<text class="axis-text" x="${PAD_L - 6}" y="${yy + 3}" text-anchor="end">${v}</text>`;
  });
  // X 라벨 (요일·일)
  trend.forEach((d, i) => {
    if (trend.length > 14 && i % 2 !== 0) return; // 너무 빽빽하면 격일
    const dd = new Date(d.date);
    const label = `${dd.getMonth() + 1}/${dd.getDate()}`;
    html += `<text class="axis-text" x="${x(i)}" y="${H - PAD_B + 14}" text-anchor="middle">${label}</text>`;
  });
  html += `<polygon class="area-c" points="${areaPts}" />`;
  html += `<polyline class="line-c" points="${linePts}" />`;
  trend.forEach((d, i) => {
    html += `<circle class="dot-c" cx="${x(i)}" cy="${y(d.conversations)}" r="3"><title>${d.date}: ${d.conversations}건 (종료 ${d.closed}건, AHT ${fmtDuration(d.aht_seconds)})</title></circle>`;
  });
  svg.innerHTML = html;
}

// --- 시간대 히트맵 (요일 × 시간) ---
const WEEKDAY_KO = ["월", "화", "수", "목", "금", "토", "일"];

async function loadHeatmap() {
  let h;
  try { h = await (await fetch("/api/dashboard/heatmap?days=28&tz_offset_hours=9")).json(); }
  catch (e) { return; }
  renderHeatmap(h);
  $("heatmap-meta").textContent =
    `최근 ${h.window_days}일 · 총 ${h.total}건 · 피크 ${h.max_count}건/시간대`;
  $("heatmap-max").textContent = `많음 (${h.max_count})`;
}

function renderHeatmap(data) {
  const svg = $("heatmap");
  const cells = data.cells || [];
  const maxV = data.max_count || 1;

  // 레이아웃 계산
  const padL = 36, padT = 22, padR = 12, padB = 14;
  const cellW = (760 - padL - padR) / 24;
  const cellH = (200 - padT - padB) / 7;

  // 색상 보간 (cool→brand)
  function color(v) {
    if (v === 0) return "#f8fafc";
    const t = Math.min(1, v / maxV);
    // #f1f5f9 → #1d4ed8
    const lerp = (a, b) => Math.round(a + (b - a) * t);
    const r = lerp(241, 29), g = lerp(245, 78), b = lerp(249, 216);
    return `rgb(${r},${g},${b})`;
  }

  let html = "";
  // 시간 라벨 (위)
  for (let h = 0; h < 24; h += 3) {
    const x = padL + h * cellW + cellW / 2;
    html += `<text class="label" x="${x}" y="${padT - 6}" text-anchor="middle">${h}</text>`;
  }
  // 요일 라벨 (왼쪽)
  for (let w = 0; w < 7; w++) {
    const y = padT + w * cellH + cellH / 2 + 3;
    html += `<text class="label" x="${padL - 6}" y="${y}" text-anchor="end">${WEEKDAY_KO[w]}</text>`;
  }
  // 셀
  for (const c of cells) {
    const x = padL + c.hour * cellW;
    const y = padT + c.weekday * cellH;
    html += `<rect class="cell" x="${x}" y="${y}" width="${cellW}" height="${cellH}" fill="${color(c.count)}" rx="2">` +
            `<title>${WEEKDAY_KO[c.weekday]} ${String(c.hour).padStart(2,'0')}:00 — ${c.count}건</title>` +
            `</rect>`;
  }
  svg.innerHTML = html;
}

// --- 상담원 성과 리더보드 ---
let agentsDays = 30;

async function loadAgents() {
  let r;
  try { r = await (await fetch(`/api/dashboard/agents?days=${agentsDays}`)).json(); }
  catch (e) { return; }
  const rows = r.agents || [];
  if (!rows.length) {
    $("agents-body").innerHTML =
      `<p class="muted">최근 ${r.window_days}일 간 배정된 상담이 없습니다.</p>`;
    return;
  }
  const escClass = (rate) => rate >= 0.3 ? "esc-high" : "";
  const csatClass = (avg) => avg == null ? "" : (avg >= 4 ? "csat-good" : (avg < 3 ? "csat-bad" : ""));
  const html = `
    <table class="agents-table">
      <thead><tr>
        <th>상담원</th>
        <th>배정</th>
        <th>종료</th>
        <th>종료율</th>
        <th>메시지</th>
        <th>AHT</th>
        <th>FRT</th>
        <th>CSAT</th>
        <th>에스컬레이션</th>
      </tr></thead>
      <tbody>
        ${rows.map((a, i) => `
          <tr class="${a.active ? '' : 'agent-inactive'}">
            <td>
              <span class="rank">#${i + 1}</span>
              <span class="agent-name">${UI.escapeHtml(a.name)}</span>
              <span class="agent-username">@${UI.escapeHtml(a.username)}</span>
              ${a.active ? '' : '<span class="badge">비활성</span>'}
            </td>
            <td>${a.assigned_count}</td>
            <td>${a.closed_count}</td>
            <td>${fmtPct(a.closure_rate)}</td>
            <td>${a.messages_sent}</td>
            <td>${fmtDuration(a.aht_seconds)}</td>
            <td>${fmtDuration(a.frt_seconds)}</td>
            <td class="${csatClass(a.csat_avg)}">
              ${a.csat_avg != null ? a.csat_avg.toFixed(1) : "—"}
              ${a.csat_count ? `<span class="agent-username"> (${a.csat_count})</span>` : ""}
            </td>
            <td class="${escClass(a.escalation_rate)}">${fmtPct(a.escalation_rate)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>`;
  $("agents-body").innerHTML = html;
}

$("agents-period").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-days]");
  if (!btn) return;
  agentsDays = parseInt(btn.dataset.days, 10);
  document.querySelectorAll("#agents-period button").forEach((b) =>
    b.classList.toggle("active", b === btn));
  loadAgents();
});

$("refresh-btn").addEventListener("click", () => { load(); loadKpi(); loadAgents(); loadHeatmap(); });
document.addEventListener("auth-ready", (e) => {
  const user = e.detail;
  const perms = user?.permissions || [];
  if (user && (user.role === "admin" || perms.includes("data.export"))) {
    document.getElementById("export-btn").classList.remove("hidden");
  }
  load();
  loadKpi();
  loadAgents();
  loadHeatmap();
});
</script>
</body>
</html>
