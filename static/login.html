<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · AI 콜센터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 400px;
    max-width: 100%;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.22);
    overflow: hidden;
  }
  header {
    background: #1d4ed8;
    color: #fff;
    padding: 24px 22px;
  }
  header h1 { font-size: 19px; font-weight: 700; }
  header .sub { font-size: 12.5px; opacity: .9; margin-top: 4px; }
  .body { padding: 26px 22px; }
  input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 10px;
    outline: none;
  }
  input:focus { border-color: #1d4ed8; }
  button {
    width: 100%;
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .msg {
    font-size: 12.5px;
    min-height: 18px;
    margin: 4px 0 12px;
  }
  .msg.error { color: #dc2626; }
  .info {
    font-size: 12px;
    color: #64748b;
    margin-top: 16px;
    text-align: center;
    line-height: 1.65;
  }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>로그인</h1>
    <div class="sub">콜센터 사용자 전용 · AI 콜센터</div>
  </header>
  <div class="body">
    <form id="form" autocomplete="on">
      <input type="text" id="username" placeholder="아이디" autocomplete="username" autofocus />
      <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" />
      <div class="msg" id="msg"></div>
      <button type="submit" id="submit">로그인</button>
    </form>
    <div class="info">
      문의: 시스템 관리자 / 헬프데스크<br />
      비밀번호 분실 시 관리자에게 초기화를 요청해 주세요.
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function safeNext(raw) {
  // 오픈 리다이렉트 방지: 같은 출처의 상대 경로만 허용 ('/'로 시작, '//' 금지, scheme 금지)
  if (!raw || typeof raw !== "string") return "/agent";
  if (!raw.startsWith("/")) return "/agent";
  if (raw.startsWith("//")) return "/agent";
  if (/^\/[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(raw)) return "/agent";
  return raw;
}

function setError(text) {
  const m = $("msg");
  m.textContent = text;
  m.className = "msg error";
}

async function submit(e) {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) {
    setError("아이디와 비밀번호를 입력해 주세요.");
    return;
  }
  $("submit").disabled = true;
  setError("");
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (res.ok) {
      const next = safeNext(new URLSearchParams(location.search).get("next"));
      location.href = next;
      return;
    }
    let detail = "로그인에 실패했습니다.";
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    setError(detail);
  } catch (e) {
    setError("서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.");
  } finally {
    $("submit").disabled = false;
  }
}

$("form").addEventListener("submit", submit);

// 이미 로그인되어 있으면 메인 화면으로 이동
fetch("/api/auth/me").then((r) => {
  if (r.ok) location.href = safeNext(new URLSearchParams(location.search).get("next"));
}).catch(() => {});
</script>
</body>
</html>
