<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-5);
    background:
      radial-gradient(circle at 18% -5%, rgba(29, 78, 216, 0.10), transparent 55%),
      radial-gradient(circle at 88% 110%, rgba(29, 78, 216, 0.10), transparent 55%),
      var(--c-bg);
  }
  .auth-card {
    width: 420px;
    max-width: 100%;
    background: var(--c-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: slide-up var(--transition-base);
  }
  .auth-head {
    background: var(--c-brand-700);
    color: #fff;
    padding: var(--space-6);
  }
  .auth-head .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: var(--fw-black);
    font-size: var(--text-md);
    margin-bottom: var(--space-4);
    opacity: .92;
  }
  .auth-head .brand-icon {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.18);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--fw-black);
  }
  .auth-head h1 { font-size: var(--text-2xl); font-weight: var(--fw-bold); letter-spacing: -.01em; }
  .auth-head .sub { font-size: var(--text-sm); opacity: .85; margin-top: 4px; }
  .auth-body { padding: var(--space-6); }
  .info {
    font-size: var(--text-xs);
    color: var(--c-text-faint);
    margin-top: var(--space-5);
    text-align: center;
    line-height: var(--leading-base);
  }
  .field-error.shown { display: block; }
</style>
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<div class="auth-card">
  <div class="auth-head">
    <div class="brand">
      <span class="brand-icon">AI</span>
      <span>AI 콜센터</span>
    </div>
    <h1>로그인</h1>
    <div class="sub">콜센터 사용자 전용 · 상담원·관리자</div>
  </div>
  <div class="auth-body">
    <form id="form" autocomplete="on">
      <div class="field">
        <label class="label">아이디</label>
        <input class="input" type="text" id="username" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label class="label">비밀번호</label>
        <input class="input" type="password" id="password" autocomplete="current-password" />
      </div>
      <div class="field-error" id="msg"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit">로그인</button>
    </form>
    <form id="form2fa" autocomplete="off" style="display:none">
      <p class="info" style="text-align:left;margin:0 0 var(--space-3)">
        인증기 앱의 6자리 코드 또는 복구 코드(XXXX-XXXX)를 입력해 주세요.
      </p>
      <div class="field">
        <label class="label">인증 코드</label>
        <input class="input" type="text" id="code" autocomplete="one-time-code"
               inputmode="numeric" placeholder="000000" maxlength="20" autofocus />
      </div>
      <div class="field-error" id="msg2fa"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submit2fa">2단계 인증</button>
      <button type="button" class="btn btn-secondary btn-block" id="back2fa" style="margin-top:8px">처음으로</button>
    </form>
    <div class="info">
      문의: 시스템 관리자 / 헬프데스크<br />
      비밀번호 분실 시 관리자에게 초기화를 요청해 주세요.
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function safeNext(raw) {
  if (!raw || typeof raw !== "string") return "/agent";
  if (!raw.startsWith("/")) return "/agent";
  if (raw.startsWith("//")) return "/agent";
  if (/^\/[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(raw)) return "/agent";
  return raw;
}

function setError(text) {
  const m = $("msg");
  m.textContent = text;
  m.classList.toggle("shown", !!text);
}

let pendingToken = null;

function setError2fa(text) {
  const m = $("msg2fa");
  m.textContent = text;
  m.classList.toggle("shown", !!text);
}

function show2faStep() {
  $("form").style.display = "none";
  $("form2fa").style.display = "";
  setTimeout(() => $("code").focus(), 50);
}
function showLoginStep() {
  $("form2fa").style.display = "none";
  $("form").style.display = "";
  pendingToken = null;
  $("code").value = "";
  setError2fa("");
}

async function submit(e) {
  e.preventDefault();
  const username = $("username").value.trim();
  const password = $("password").value;
  if (!username || !password) {
    setError("아이디와 비밀번호를 입력해 주세요.");
    return;
  }
  $("submit").disabled = true;
  setError("");
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.needs_2fa) {
        pendingToken = data.pending_token;
        show2faStep();
        return;
      }
      location.href = safeNext(new URLSearchParams(location.search).get("next"));
      return;
    }
    let detail = "로그인에 실패했습니다.";
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    setError(detail);
  } catch (e) {
    setError("서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.");
  } finally {
    $("submit").disabled = false;
  }
}

async function submit2fa(e) {
  e.preventDefault();
  const code = $("code").value.trim();
  if (!code) { setError2fa("인증 코드를 입력해 주세요."); return; }
  if (!pendingToken) { showLoginStep(); return; }
  $("submit2fa").disabled = true;
  setError2fa("");
  try {
    const res = await fetch("/api/auth/2fa/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pending_token: pendingToken, code }),
    });
    if (res.ok) {
      const data = await res.json();
      if (data.used_recovery) {
        alert("복구 코드로 로그인했습니다. 로그인 후 새 복구 코드를 발급하거나 2FA 를 다시 설정해 주세요.");
      }
      location.href = safeNext(new URLSearchParams(location.search).get("next"));
      return;
    }
    // 새 임시 토큰이 헤더로 오면 갱신 (무차별 대입 차단)
    const newTok = res.headers.get("X-Pending-Token");
    if (newTok) pendingToken = newTok;
    let detail = "인증 코드가 올바르지 않습니다.";
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    setError2fa(detail);
  } catch (e) {
    setError2fa("서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.");
  } finally {
    $("submit2fa").disabled = false;
  }
}

$("form").addEventListener("submit", submit);
$("form2fa").addEventListener("submit", submit2fa);
$("back2fa").addEventListener("click", showLoginStep);

fetch("/api/auth/me").then((r) => {
  if (r.ok) location.href = safeNext(new URLSearchParams(location.search).get("next"));
}).catch(() => {});
</script>
</body>
</html>
