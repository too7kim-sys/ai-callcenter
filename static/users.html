<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사용자 관리 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  .role-chip.admin { background: var(--c-warning-bg); color: var(--c-warning); border-color: var(--c-warning-border); }
  .role-chip.agent { background: var(--c-brand-50); color: var(--c-brand-800); border-color: var(--c-brand-100); }
  .role-chip.custom { background: var(--c-info-bg); color: var(--c-info); border-color: var(--c-info-border); }
  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: var(--text-xs);
    font-weight: var(--fw-semibold);
  }
  .status-dot::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: currentColor;
  }
  .status-dot.active   { color: var(--c-success); }
  .status-dot.inactive { color: var(--c-text-faint); }
  .status-dot.locked   { color: var(--c-warning); }
  .table td { font-size: var(--text-base); vertical-align: middle; }
  .table .username { font-weight: var(--fw-bold); }
  .table .me-tag { color: var(--c-text-faint); font-size: var(--text-xs); margin-left: 6px; font-weight: var(--fw-medium); }
  .inline-select {
    font-size: var(--text-xs);
    padding: 3px 22px 3px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--c-border-strong);
    background: var(--c-surface);
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%2364748b' d='M5 6 0 0h10z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 6px center;
  }
  .new-form-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1.2fr 0.9fr 1.2fr auto;
    gap: var(--space-2);
    align-items: flex-end;
  }
  @media (max-width: 760px) {
    .new-form-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header id="app-nav"></header>

<header class="page-header">
  <div>
    <div class="title">사용자 관리</div>
    <div class="subtitle">콜센터 사용자(상담원·관리자)를 관리합니다.</div>
  </div>
  <div class="meta">
    <span class="chip" id="count-chip">·</span>
    <a class="btn btn-secondary btn-sm hidden" id="export-btn" href="/api/export/users.csv" download>CSV 다운로드</a>
  </div>
</header>

<div class="page-container">
  <section class="card" style="margin-bottom: var(--space-4)">
    <div class="card-head">
      <div class="title">신규 사용자 추가</div>
    </div>
    <div class="card-body">
      <div class="new-form-row">
        <div class="field" style="margin:0">
          <div class="label">아이디</div>
          <input class="input" id="new-username" placeholder="영문/숫자/._-" />
        </div>
        <div class="field" style="margin:0">
          <div class="label">이름</div>
          <input class="input" id="new-name" placeholder="이름" />
        </div>
        <div class="field" style="margin:0">
          <div class="label">이메일 (선택)</div>
          <input class="input" id="new-email" placeholder="user@example.com" />
        </div>
        <div class="field" style="margin:0">
          <div class="label">역할</div>
          <select class="select" id="new-role"></select>
        </div>
        <div class="field" style="margin:0">
          <div class="label">비밀번호</div>
          <input class="input" type="password" id="new-password" placeholder="8자 이상" />
        </div>
        <button class="btn btn-primary" id="create-btn">추가</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="title">사용자 목록</div>
    </div>
    <table class="table">
      <thead>
        <tr>
          <th style="width:50px">ID</th>
          <th>아이디</th>
          <th>이름</th>
          <th>역할</th>
          <th>상태</th>
          <th>최근 로그인</th>
          <th style="text-align:right">관리</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let me = null;
let users = [];
let availableRoles = [];

function fmt(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return iso; }
}

function isLocked(u) {
  if (!u.locked_until) return false;
  try { return new Date(u.locked_until) > new Date(); } catch (e) { return false; }
}

const roleLabel = (r) => ({ admin: "관리자", agent: "상담원" }[r] || r);

async function loadAll() {
  try {
    const [uRes, rRes] = await Promise.all([
      fetch("/api/users"),
      fetch("/api/roles"),
    ]);
    if (!uRes.ok) throw new Error("users");
    users = await uRes.json();
    availableRoles = rRes.ok ? await rRes.json() : [{ name: "agent" }, { name: "admin" }];
    renderRoleOptions();
    render();
  } catch (e) {
    UI.toast("사용자 목록을 불러오지 못했습니다.", { type: "danger" });
  }
}

function renderRoleOptions() {
  const opts = availableRoles
    .map((r) => `<option value="${UI.escapeHtml(r.name)}">${UI.escapeHtml(roleLabel(r.name))}</option>`)
    .join("");
  $("new-role").innerHTML = opts;
}

function render() {
  $("count-chip").textContent = `${users.length}명`;
  $("rows").innerHTML = users.map((u) => {
    const locked = isLocked(u);
    const statusKey = !u.active ? "inactive" : (locked ? "locked" : "active");
    const statusLabel = !u.active ? "비활성" : (locked ? "잠김" : "활성");
    const roleClass = u.role === "admin" ? "admin" : (u.role === "agent" ? "agent" : "custom");
    const roleChip = `<span class="chip role-chip ${roleClass}">${UI.escapeHtml(roleLabel(u.role))}</span>`;
    const isMe = me && u.id === me.id;
    const roleSelect = availableRoles.length > 1
      ? '<select class="inline-select" data-role-id="' + u.id + '">'
        + availableRoles.map((r) => `<option value="${UI.escapeHtml(r.name)}" ${r.name === u.role ? "selected" : ""}>${UI.escapeHtml(roleLabel(r.name))}</option>`).join("")
        + '</select>'
      : "";
    const actions = [
      `<button class="btn btn-ghost btn-xs" data-act="edit" data-id="${u.id}">정보 수정</button>`,
      `<button class="btn btn-ghost btn-xs" data-act="reset" data-id="${u.id}">비밀번호 초기화</button>`,
      roleSelect,
      `<button class="btn btn-ghost btn-xs" data-act="active" data-id="${u.id}">${u.active ? "비활성화" : "활성화"}</button>`,
      locked ? `<button class="btn btn-ghost btn-xs" data-act="unlock" data-id="${u.id}">잠금 해제</button>` : "",
      `<button class="btn btn-danger btn-xs" data-act="delete" data-id="${u.id}">삭제</button>`,
    ].filter(Boolean).join("");
    return `
      <tr>
        <td class="muted">${u.id}</td>
        <td><span class="username">${UI.escapeHtml(u.username)}</span>${isMe ? '<span class="me-tag">(나)</span>' : ''}</td>
        <td>${UI.escapeHtml(u.name || "")}</td>
        <td>${roleChip}</td>
        <td><span class="status-dot ${statusKey}">${statusLabel}</span></td>
        <td class="muted">${UI.escapeHtml(fmt(u.last_login_at))}</td>
        <td><div class="actions">${actions}</div></td>
      </tr>`;
  }).join("");

  document.querySelectorAll("[data-act]").forEach((b) => {
    b.addEventListener("click", () => doAction(b.dataset.act, parseInt(b.dataset.id, 10)));
  });
  document.querySelectorAll("[data-role-id]").forEach((sel) => {
    sel.addEventListener("change", () => changeRole(parseInt(sel.dataset.roleId, 10), sel.value));
  });
}

async function changeRole(id, newRole) {
  try {
    const res = await fetch(`/api/users/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: newRole }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("역할을 변경했습니다.", { type: "success" });
    await loadAll();
  } catch (e) {
    UI.toast(e?.detail || "역할 변경에 실패했습니다.", { type: "danger" });
    await loadAll();
  }
}

async function doAction(act, id) {
  const user = users.find((u) => u.id === id);
  if (!user) return;
  try {
    if (act === "delete") {
      const ok = await UI.confirm(`사용자 ${user.username}을(를) 삭제합니다.\n이 작업은 되돌릴 수 없습니다.`,
        { title: "사용자 삭제", okText: "삭제", danger: true });
      if (!ok) return;
      const res = await fetch(`/api/users/${id}`, { method: "DELETE" });
      if (!res.ok) throw await res.json();
      UI.toast("삭제했습니다.", { type: "success" });

    } else if (act === "edit") {
      const data = await UI.form({
        title: "정보 수정",
        description: `${user.username} 사용자의 이름과 이메일을 수정합니다.`,
        fields: [
          { name: "name", label: "이름", value: user.name || "", required: true, maxLength: 64 },
          { name: "email", label: "이메일", value: user.email || "", placeholder: "비우면 삭제됩니다", maxLength: 200 },
        ],
        okText: "저장",
      });
      if (!data) return;
      const res = await fetch(`/api/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: data.name.trim(), email: data.email.trim() }),
      });
      if (!res.ok) throw await res.json();
      UI.toast("정보를 수정했습니다.", { type: "success" });

    } else if (act === "reset") {
      const data = await UI.form({
        title: "비밀번호 초기화",
        description: `${user.username} 사용자의 새 비밀번호를 입력하세요.`,
        fields: [
          { name: "pw", label: "새 비밀번호", type: "password", required: true,
            minLength: 8, placeholder: "8자 이상", autocomplete: "new-password" },
        ],
        okText: "초기화",
      });
      if (!data) return;
      const res = await fetch(`/api/users/${id}/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ new_password: data.pw }),
      });
      if (!res.ok) throw await res.json();
      UI.toast("비밀번호를 초기화했습니다.", { type: "success" });

    } else if (act === "active") {
      const res = await fetch(`/api/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: !user.active }),
      });
      if (!res.ok) throw await res.json();
      UI.toast(user.active ? "비활성화했습니다." : "활성화했습니다.", { type: "success" });

    } else if (act === "unlock") {
      const res = await fetch(`/api/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ unlock: true }),
      });
      if (!res.ok) throw await res.json();
      UI.toast("잠금을 해제했습니다.", { type: "success" });
    }
    await loadAll();
  } catch (e) {
    UI.toast(e?.detail || "처리 중 오류가 발생했습니다.", { type: "danger" });
  }
}

async function createUser() {
  const payload = {
    username: $("new-username").value.trim(),
    name: $("new-name").value.trim(),
    email: $("new-email").value.trim(),
    role: $("new-role").value,
    password: $("new-password").value,
  };
  if (!payload.username || !payload.name || !payload.password) {
    UI.toast("아이디·이름·비밀번호는 필수입니다.", { type: "warning" });
    return;
  }
  if (payload.password.length < 8) {
    UI.toast("비밀번호는 8자 이상이어야 합니다.", { type: "warning" });
    return;
  }
  const btn = $("create-btn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw await res.json();
    ["new-username", "new-name", "new-email", "new-password"].forEach((id) => $(id).value = "");
    if (availableRoles.length) $("new-role").value = "agent";
    UI.toast("사용자를 추가했습니다.", { type: "success" });
    await loadAll();
  } catch (e) {
    UI.toast(e?.detail || "생성에 실패했습니다.", { type: "danger" });
  } finally {
    btn.disabled = false;
  }
}

$("create-btn").addEventListener("click", createUser);

document.addEventListener("auth-ready", (e) => {
  me = e.detail;
  if (me && me.role !== "admin" && !(me.permissions || []).includes("user.manage")) {
    location.href = "/agent";
    return;
  }
  if (me && (me.role === "admin" || (me.permissions || []).includes("data.export"))) {
    document.getElementById("export-btn").classList.remove("hidden");
  }
  loadAll();
});
</script>
</body>
</html>
