<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사용자 관리 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f1f5f9;
    color: #0f172a;
    min-height: 100vh;
  }
  header {
    background: #0f172a;
    color: #fff;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 700; }
  header .nav { display: flex; gap: 14px; align-items: center; font-size: 12px; }
  header .nav a {
    color: #fff;
    text-decoration: none;
    opacity: .9;
  }
  header .nav a:hover { text-decoration: underline; }
  header .me {
    background: rgba(255, 255, 255, .18);
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
  }
  .container { max-width: 980px; margin: 0 auto; padding: 20px 22px 60px; }
  .panel {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 14px;
    font-weight: 700;
    color: #1d4ed8;
    margin-bottom: 12px;
  }
  .form-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr) auto;
    gap: 8px;
    align-items: stretch;
  }
  input, select {
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    background: #fff;
  }
  input:focus, select:focus { border-color: #1d4ed8; }
  button {
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid #cbd5e1;
    background: #fff;
    color: #334155;
  }
  button.primary {
    background: #1d4ed8;
    color: #fff;
    border-color: #1d4ed8;
  }
  button.danger {
    background: #fff;
    color: #b91c1c;
    border-color: #fecaca;
  }
  button:disabled { opacity: .6; cursor: progress; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid #f1f5f9;
  }
  th { color: #64748b; font-weight: 700; font-size: 12px; background: #f8fafc; }
  td .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  td .actions button { padding: 4px 9px; font-size: 11.5px; }
  .role-chip {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .role-chip.admin { background: #fef3c7; color: #92400e; }
  .role-chip.agent { background: #eff6ff; color: #1d4ed8; }
  .status-chip {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .status-chip.active { background: #ecfdf5; color: #047857; }
  .status-chip.inactive { background: #fef2f2; color: #b91c1c; }
  .status-chip.locked { background: #fef3c7; color: #92400e; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f172a;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    z-index: 100;
    opacity: 0;
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) {
    .form-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header id="app-nav"></header>

<div class="container">
  <div style="padding:6px 0 16px"><h1 style="font-size:18px;font-weight:700;color:#0f172a">사용자 관리</h1></div>
  <div class="panel">
    <h2>신규 사용자 추가</h2>
    <div class="form-row">
      <input id="new-username" placeholder="아이디 (영문/숫자/._-)" />
      <input id="new-name" placeholder="이름" />
      <input id="new-email" placeholder="이메일 (선택)" />
      <select id="new-role"></select>
      <input id="new-password" type="password" placeholder="비밀번호 (8자 이상)" />
      <button class="primary" id="create-btn">추가</button>
    </div>
  </div>

  <div class="panel">
    <h2>사용자 목록</h2>
    <table id="table">
      <thead>
        <tr>
          <th>ID</th><th>아이디</th><th>이름</th><th>역할</th><th>상태</th>
          <th>최근 로그인</th><th>가입일</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let me = null;
let users = [];
let availableRoles = [];

function escapeHtml(t) {
  const d = document.createElement("div");
  d.textContent = t == null ? "" : String(t);
  return d.innerHTML;
}

function fmt(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return iso; }
}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function isLocked(u) {
  if (!u.locked_until) return false;
  try { return new Date(u.locked_until) > new Date(); } catch (e) { return false; }
}

async function loadUsersAndRoles() {
  try {
    const [uRes, rRes] = await Promise.all([
      fetch("/api/users"),
      fetch("/api/roles"),
    ]);
    if (!uRes.ok) throw new Error("users");
    users = await uRes.json();
    if (rRes.ok) {
      availableRoles = await rRes.json();
    } else {
      // 권한이 없는 경우 기본 역할만
      availableRoles = [{ name: "agent" }, { name: "admin" }];
    }
    renderRoleOptions();
    render();
  } catch (e) {
    toast("사용자 목록을 불러오지 못했습니다.");
  }
}

function renderRoleOptions() {
  const labels = { admin: "관리자", agent: "상담원" };
  const opts = availableRoles
    .map((r) => `<option value="${r.name}">${labels[r.name] || r.name}</option>`)
    .join("");
  $("new-role").innerHTML = opts;
}

function render() {
  $("rows").innerHTML = users.map((u) => {
    const locked = isLocked(u);
    const statusChip = !u.active
      ? '<span class="status-chip inactive">비활성</span>'
      : locked
      ? '<span class="status-chip locked">잠김</span>'
      : '<span class="status-chip active">활성</span>';
    const roleLabels = { admin: "관리자", agent: "상담원" };
    const roleClass = u.role === "admin" ? "admin" : "agent";
    const roleChip = `<span class="role-chip ${roleClass}">${escapeHtml(roleLabels[u.role] || u.role)}</span>`;
    const isMe = me && u.id === me.id;
    // 역할 변경 드롭다운 inline (커스텀 역할 지원)
    const roleSelect = availableRoles.length > 1
      ? '<select class="role-select" data-id="' + u.id + '" style="font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid #cbd5e1">'
        + availableRoles.map((r) => `<option value="${escapeHtml(r.name)}" ${r.name === u.role ? "selected" : ""}>${escapeHtml(roleLabels[r.name] || r.name)}</option>`).join("")
        + '</select>'
      : '';
    const actions = [
      `<button data-act="edit" data-id="${u.id}">정보 수정</button>`,
      `<button data-act="reset" data-id="${u.id}">비밀번호 초기화</button>`,
      roleSelect,
      `<button data-act="active" data-id="${u.id}">${u.active ? "비활성화" : "활성화"}</button>`,
      locked ? `<button data-act="unlock" data-id="${u.id}">잠금 해제</button>` : "",
      `<button class="danger" data-act="delete" data-id="${u.id}">삭제</button>`,
    ].filter(Boolean).join(" ");
    return `
      <tr>
        <td>${u.id}</td>
        <td><b>${escapeHtml(u.username)}</b>${isMe ? ' <span style="color:#94a3b8;font-size:11px">(나)</span>' : ''}</td>
        <td>${escapeHtml(u.name || "")}</td>
        <td>${roleChip}</td>
        <td>${statusChip}</td>
        <td style="color:#64748b">${escapeHtml(fmt(u.last_login_at))}</td>
        <td style="color:#94a3b8">${escapeHtml(fmt(u.created_at))}</td>
        <td><div class="actions">${actions}</div></td>
      </tr>`;
  }).join("");

  document.querySelectorAll("[data-act]").forEach((b) => {
    b.addEventListener("click", () => doAction(b.dataset.act, parseInt(b.dataset.id, 10)));
  });
  document.querySelectorAll(".role-select").forEach((sel) => {
    sel.addEventListener("change", () => changeRole(parseInt(sel.dataset.id, 10), sel.value));
  });
}

async function changeRole(id, newRole) {
  try {
    const res = await fetch(`/api/users/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role: newRole }),
    });
    if (!res.ok) throw await res.json();
    toast("역할을 변경했습니다.");
    await loadUsersAndRoles();
  } catch (e) {
    toast(e?.detail || "역할 변경에 실패했습니다.");
    await loadUsersAndRoles();
  }
}

async function doAction(act, id) {
  const user = users.find((u) => u.id === id);
  if (!user) return;
  try {
    if (act === "delete") {
      if (!confirm(`사용자 ${user.username}을(를) 삭제하시겠습니까?`)) return;
      const res = await fetch(`/api/users/${id}`, { method: "DELETE" });
      if (!res.ok) throw await res.json();
      toast("삭제했습니다.");
    } else if (act === "edit") {
      const newName = prompt("이름:", user.name || "");
      if (newName === null) return;
      const newEmail = prompt("이메일 (비우면 삭제):", user.email || "");
      if (newEmail === null) return;
      const trimmedName = newName.trim();
      if (!trimmedName) { toast("이름은 비울 수 없습니다."); return; }
      const res = await fetch(`/api/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: trimmedName, email: newEmail.trim() }),
      });
      if (!res.ok) throw await res.json();
      toast("정보를 수정했습니다.");
    } else if (act === "reset") {
      const pw = prompt("새 비밀번호 (8자 이상):");
      if (!pw) return;
      if (pw.length < 8) { toast("8자 이상이어야 합니다."); return; }
      const res = await fetch(`/api/users/${id}/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ new_password: pw }),
      });
      if (!res.ok) throw await res.json();
      toast("비밀번호를 초기화했습니다.");
    } else if (act === "active") {
      const res = await fetch(`/api/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: !user.active }),
      });
      if (!res.ok) throw await res.json();
      toast(user.active ? "비활성화했습니다." : "활성화했습니다.");
    } else if (act === "unlock") {
      const res = await fetch(`/api/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ unlock: true }),
      });
      if (!res.ok) throw await res.json();
      toast("잠금을 해제했습니다.");
    }
    await loadUsersAndRoles();
  } catch (e) {
    toast(e?.detail || "처리 중 오류가 발생했습니다.");
  }
}

async function createUser() {
  const payload = {
    username: $("new-username").value.trim(),
    name: $("new-name").value.trim(),
    email: $("new-email").value.trim(),
    role: $("new-role").value,
    password: $("new-password").value,
  };
  if (!payload.username || !payload.name || !payload.password) {
    toast("아이디·이름·비밀번호는 필수입니다.");
    return;
  }
  if (payload.password.length < 8) {
    toast("비밀번호는 8자 이상이어야 합니다.");
    return;
  }
  $("create-btn").disabled = true;
  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw await res.json();
    ["new-username", "new-name", "new-email", "new-password"].forEach((id) => $(id).value = "");
    if (availableRoles.length) $("new-role").value = "agent";
    toast("사용자를 추가했습니다.");
    await loadUsersAndRoles();
  } catch (e) {
    toast(e?.detail || "생성에 실패했습니다.");
  } finally {
    $("create-btn").disabled = false;
  }
}

$("create-btn").addEventListener("click", createUser);

document.addEventListener("auth-ready", (e) => {
  me = e.detail;
  if (me && me.role !== "admin" && !(me.permissions || []).includes("user.manage")) {
    location.href = "/agent";
    return;
  }
  loadUsersAndRoles();
});
</script>
</body>
</html>
