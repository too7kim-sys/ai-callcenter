<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 고객센터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #e2e8f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat {
    width: 440px;
    max-width: 100%;
    height: 100vh;
    max-height: 760px;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(15, 23, 42, 0.25);
    border-radius: 14px;
    overflow: hidden;
  }
  header {
    background: #1d4ed8;
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .22);
    font-weight: 600;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    background: #f1f5f9;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; flex-direction: column; max-width: 82%; }
  .row.customer { align-self: flex-end; align-items: flex-end; }
  .row.ai, .row.agent { align-self: flex-start; align-items: flex-start; }
  .who { font-size: 11px; color: #64748b; margin-bottom: 3px; padding: 0 4px; }
  .bubble {
    padding: 10px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .customer .bubble { background: #1d4ed8; color: #fff; border-bottom-right-radius: 4px; }
  .ai .bubble { background: #fff; color: #0f172a; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .agent .bubble { background: #ecfdf5; color: #064e3b; border: 1px solid #a7f3d0; border-bottom-left-radius: 4px; }
  .notice {
    align-self: center;
    background: #fef9c3;
    color: #854d0e;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .composer {
    border-top: 1px solid #e2e8f0;
    padding: 12px;
    display: flex;
    gap: 8px;
    background: #fff;
  }
  .composer input {
    flex: 1;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14px;
    outline: none;
  }
  .composer input:focus { border-color: #1d4ed8; }
  .composer button, .start button {
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:disabled { background: #94a3b8; cursor: not-allowed; }
  .start {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 30px;
    background: #f1f5f9;
  }
  .start p { color: #475569; font-size: 14px; text-align: center; }
  .start input {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
  }
  .start button { padding: 12px; width: 100%; }
  .hint { font-size: 11px; color: #94a3b8; text-align: center; padding: 8px; }
  .typing .bubble { color: #94a3b8; font-style: italic; }
  /* 영업시간 배너 / 메시지 피드백 / 액션 버튼 */
  .biz-banner {
    background: #fef3c7;
    color: #92400e;
    border-bottom: 1px solid #fde68a;
    padding: 8px 14px;
    font-size: 12px;
    text-align: center;
    line-height: 1.5;
  }
  .ai .feedback, .agent .feedback {
    display: flex;
    gap: 4px;
    margin-top: 4px;
    margin-left: 4px;
  }
  .fb-btn {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11px;
    cursor: pointer;
    color: #64748b;
    transition: background .15s;
  }
  .fb-btn:hover { background: #f1f5f9; }
  .fb-btn.active.up { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .fb-btn.active.down { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .quick-actions {
    display: flex;
    gap: 6px;
    padding: 6px 12px 0;
    border-top: 1px solid #f1f5f9;
    background: #fff;
  }
  .quick-actions .qa-btn {
    background: #f1f5f9;
    border: none;
    color: #475569;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 11.5px;
    cursor: pointer;
    font-weight: 600;
  }
  .quick-actions .qa-btn:hover { background: #e2e8f0; }
  .quick-actions .qa-btn.danger { color: #b91c1c; }
  /* 통화 상태 바 */
  .call-bar {
    display: none;
    padding: 10px 16px;
    background: #1d4ed8;
    color: #fff;
    font-size: 13px;
    text-align: center;
  }
  .call-bar.shown { display: block; }
  .call-bar .hangup {
    margin-left: 12px;
    background: #ef4444;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .call-bar.connected { background: #16a34a; }
  .icon-btn {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    width: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #475569;
    padding: 0;
  }
  .icon-btn svg { width: 21px; height: 21px; }
  .icon-btn.listening {
    background: #dc2626;
    border-color: #dc2626;
    color: #fff;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .header-btn {
    background: rgba(255, 255, 255, .22);
    border: none;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fff;
    padding: 0;
  }
  .header-btn svg { width: 18px; height: 18px; }
  .header-btn.off { opacity: .4; }
  @media (max-width: 480px) {
    .chat { height: 100vh; max-height: 100vh; border-radius: 0; }
  }
  /* 상담 종료 만족도 모달 */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, .55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    width: 360px; max-width: 92%;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .35);
  }
  .modal h3 { font-size: 16px; margin-bottom: 6px; color: #0f172a; }
  .modal p { font-size: 13px; color: #64748b; margin-bottom: 14px; line-height: 1.5; }
  .stars { display: flex; gap: 4px; justify-content: center; margin: 8px 0 16px; }
  .stars button {
    background: none; border: none; cursor: pointer;
    font-size: 30px; color: #cbd5e1; padding: 0;
    transition: color .15s;
  }
  .stars button.on, .stars button:hover { color: #f59e0b; }
  .modal textarea {
    width: 100%; min-height: 70px;
    border: 1px solid #cbd5e1; border-radius: 8px;
    padding: 9px; font-size: 13px; font-family: inherit;
    resize: vertical; outline: none;
  }
  .modal textarea:focus { border-color: #1d4ed8; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button {
    flex: 1; border-radius: 8px; padding: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  }
  .modal-actions .btn-cancel { background: #f1f5f9; color: #475569; }
  .modal-actions .btn-ok { background: #1d4ed8; color: #fff; }
</style>
<script src="/assets/pwa.js" defer></script>
<script src="/assets/webrtc.js"></script>
</head>
<body>
<div class="chat">
  <header>
    <div>
      <h1>AI 고객센터</h1>
      <div class="sub">무엇이든 문의해 주세요</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="tts-btn" title="봇 음성 답변 켜기/끄기" aria-label="봇 음성 답변 켜기/끄기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z" />
          <path d="M16 9a4 4 0 0 1 0 6" />
          <path d="M19 6.5a8 8 0 0 1 0 11" />
        </svg>
      </button>
      <span class="badge" id="mode-badge">·</span>
    </div>
  </header>

  <div class="start" id="start-view">
    <p>상담을 시작하려면 성함을 입력해 주세요.<br />AI 상담원이 즉시 응대해 드립니다.</p>
    <input id="name-input" placeholder="성함 (예: 홍길동)" maxlength="30" />
    <button id="start-btn">상담 시작하기</button>
  </div>

  <div class="biz-banner" id="biz-banner" style="display:none"></div>
  <div class="messages" id="messages" style="display:none"></div>
  <div class="quick-actions" id="quick-actions" style="display:none">
    <button class="qa-btn" id="qa-agent">🙋 상담원 연결</button>
    <button class="qa-btn" id="qa-call">☎ 통화 요청</button>
    <button class="qa-btn" id="qa-callback">📞 콜백 예약</button>
    <button class="qa-btn danger" id="qa-end">상담 종료</button>
  </div>

  <!-- 통화 중 상태 표시 -->
  <div id="call-bar" class="call-bar" aria-live="polite">
    <span id="call-status">통화 연결 중…</span>
    <button id="call-hangup-btn" class="hangup" type="button">끊기</button>
  </div>
  <div class="composer" id="composer" style="display:none">
    <button class="icon-btn" id="mic-btn" title="음성으로 말하기" aria-label="음성으로 말하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3" />
        <path d="M5 11a7 7 0 0 0 14 0" />
        <line x1="12" y1="18" x2="12" y2="22" />
      </svg>
    </button>
    <input id="msg-input" placeholder="메시지를 입력하세요" autocomplete="off" />
    <button id="send-btn">전송</button>
  </div>
  <div class="hint" id="hint" style="display:none">AI 응답은 참고용이며, 상담원이 함께 확인합니다.</div>
</div>

<script>
const API = "";
let conversationId = null;
let renderedIds = new Set();
let pollTimer = null;
let sending = false;  // 전송 중에는 폴링을 일시 정지해 화면 중복 방지

const $ = (id) => document.getElementById(id);

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

const MODE_LABEL = { claude: "Claude 연결됨", ollama: "Ollama 연결됨", mock: "데모 모드" };

async function loadConfig() {
  try {
    const res = await fetch(API + "/api/config");
    const cfg = await res.json();
    $("mode-badge").textContent = MODE_LABEL[cfg.ai_mode] || "데모 모드";
  } catch (e) {
    $("mode-badge").textContent = "오프라인";
  }
}

async function loadBusinessStatus() {
  try {
    const res = await fetch(API + "/api/business-status");
    if (!res.ok) return;
    const s = await res.json();
    if (!s.active && s.message) {
      const b = $("biz-banner");
      b.textContent = s.message;
      b.style.display = "block";
    }
  } catch (e) { /* 무시 */ }
}

const WHO = { ai: "AI 상담봇", agent: "상담원", customer: "" };

function appendMessage(msg) {
  if (renderedIds.has(msg.id)) return;
  renderedIds.add(msg.id);
  const row = document.createElement("div");
  row.className = "row " + msg.role;
  const label = WHO[msg.role];
  let fbHtml = "";
  if (msg.role === "ai" || msg.role === "agent") {
    const upActive = msg.feedback === "up" ? "active up" : "";
    const downActive = msg.feedback === "down" ? "active down" : "";
    fbHtml = `<div class="feedback">
      <button class="fb-btn ${upActive}" data-fb="up" data-msg="${msg.id}">👍</button>
      <button class="fb-btn ${downActive}" data-fb="down" data-msg="${msg.id}">👎</button>
    </div>`;
  }
  row.innerHTML =
    (label ? `<div class="who">${label}</div>` : "") +
    `<div class="bubble">${escapeHtml(msg.content)}</div>` +
    fbHtml;
  row.querySelectorAll("[data-fb]").forEach((b) => {
    b.addEventListener("click", () => sendFeedback(parseInt(b.dataset.msg, 10), b.dataset.fb));
  });
  $("messages").appendChild(row);
  scrollDown();
  if (msg.role === "ai" || msg.role === "agent") speak(msg.content);
}

async function sendFeedback(messageId, value) {
  try {
    const cur = document.querySelector(`[data-msg="${messageId}"][data-fb="${value}"]`);
    const isActive = cur && cur.classList.contains("active");
    const newValue = isActive ? "" : value;
    const res = await fetch(`/api/messages/${messageId}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: newValue }),
    });
    if (!res.ok) throw new Error("실패");
    // 토글 UI
    document.querySelectorAll(`[data-msg="${messageId}"]`).forEach((b) => {
      b.classList.remove("active", "up", "down");
    });
    if (newValue) {
      const sel = document.querySelector(`[data-msg="${messageId}"][data-fb="${newValue}"]`);
      if (sel) sel.classList.add("active", newValue);
    }
  } catch (e) { /* 무시 */ }
}

function scrollDown() {
  const box = $("messages");
  box.scrollTop = box.scrollHeight;
}

function showTyping() {
  removeTyping();
  const row = document.createElement("div");
  row.className = "row ai typing";
  row.id = "typing";
  row.innerHTML = `<div class="who">AI 상담봇</div><div class="bubble">입력 중…</div>`;
  $("messages").appendChild(row);
  scrollDown();
}
function removeTyping() {
  const t = $("typing");
  if (t) t.remove();
}

function appendTemp(text) {
  const row = document.createElement("div");
  row.className = "row customer temp";
  row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  $("messages").appendChild(row);
  scrollDown();
}
function clearTemp() {
  document.querySelectorAll(".row.temp").forEach((el) => el.remove());
}

function renderConversation(conv) {
  (conv.messages || []).forEach(appendMessage);
}

async function startChat() {
  const startBtn = $("start-btn");
  startBtn.disabled = true;
  const name = $("name-input").value.trim() || "고객";
  let conv;
  try {
    const res = await fetch(API + "/api/conversations", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_name: name }),
    });
    if (!res.ok) {
      // 흔한 원인: 429 (IP 당 5/분 rate limit) → 명확히 안내하고 다시 시도 가능
      const err = await res.json().catch(() => ({}));
      const msg = res.status === 429
        ? "요청이 잠시 많아 상담을 시작할 수 없습니다. 1분 후 다시 시도해 주세요."
        : (err.detail || `상담 시작에 실패했습니다 (HTTP ${res.status}).`);
      alert(msg);
      return;
    }
    conv = await res.json();
  } catch (e) {
    alert("서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.");
    return;
  } finally {
    startBtn.disabled = false;
  }
  if (!conv || !conv.id) {
    alert("상담을 시작하지 못했습니다. 새로고침 후 다시 시도해 주세요.");
    return;
  }
  conversationId = conv.id;
  $("start-view").style.display = "none";
  $("messages").style.display = "flex";
  $("composer").style.display = "flex";
  $("quick-actions").style.display = "flex";
  $("hint").style.display = "block";

  const greet = document.createElement("div");
  greet.className = "notice";
  greet.textContent = `${name}님, 안녕하세요! 무엇을 도와드릴까요?`;
  $("messages").appendChild(greet);

  warmUpTts(); // iOS 등에서 사용자 제스처 내에 음성 엔진을 활성화
  $("msg-input").focus();
  startPolling();
  startSse(conversationId);  // 상담원 답변·상태 변경 실시간 푸시 구독
}

async function sendMessage() {
  const input = $("msg-input");
  const text = input.value.trim();
  if (!text) return;
  if (!conversationId) {
    // 시작 단계가 실패해 conversationId 가 없는 비정상 상태 — 사용자 안내
    const err = document.createElement("div");
    err.className = "notice";
    err.textContent = "상담이 시작되지 않았습니다. 페이지를 새로고침 후 다시 시도해 주세요.";
    $("messages").appendChild(err);
    return;
  }
  if (sending) return; // 이미 전송 중이면 중복 무시
  input.value = "";
  $("send-btn").disabled = true;
  sending = true;
  appendTemp(text); // 서버 저장 전 임시 표시 (응답 수신 시 교체)
  showTyping();

  try {
    const res = await fetch(API + `/api/conversations/${conversationId}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error("요청 실패");
    const data = await res.json();
    removeTyping();
    clearTemp();
    renderConversation(data.conversation);
  } catch (e) {
    removeTyping();
    clearTemp();
    input.value = text; // 실패 시 입력 복원
    const err = document.createElement("div");
    err.className = "notice";
    err.textContent = "전송 중 오류가 발생했습니다. 다시 시도해 주세요.";
    $("messages").appendChild(err);
  } finally {
    sending = false;
    $("send-btn").disabled = false;
    input.focus();
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  // SSE 가 푸시로 갱신 — 폴링은 SSE 연결 실패 시 안전망(30초)
  const intervalMs = _sseActive ? 30000 : 4000;
  pollTimer = setInterval(async () => {
    if (!conversationId || sending) return;
    try {
      const res = await fetch(API + `/api/conversations/${conversationId}`);
      if (res.ok) renderConversation(await res.json());
    } catch (e) { /* 무시 */ }
  }, intervalMs);
}

// --- SSE 실시간 구독 (상담원 답변 즉시 반영) ---
let _sse = null;
let _sseActive = false;

function startSse(convId) {
  if (typeof EventSource === "undefined") return;
  try { if (_sse) _sse.close(); } catch (_) {}
  try {
    _sse = new EventSource(API + `/api/events/stream?conversation_id=${convId}`);
    _sse.addEventListener("open", () => {
      _sseActive = true;
      startPolling();  // 폴링 주기를 안전망 모드(30초)로 다시 세팅
    });
    const refresh = async () => {
      if (sending || !conversationId) return;
      try {
        const res = await fetch(API + `/api/conversations/${conversationId}`);
        if (res.ok) renderConversation(await res.json());
      } catch (e) { /* 무시 */ }
    };
    _sse.addEventListener("message_created", refresh);
    _sse.addEventListener("conversation_updated", refresh);
    // 끊김이 링버퍼 한계를 넘어 일부 이벤트 손실 시 — 전체 상태 복구
    _sse.addEventListener("stream_gap", refresh);
    _sse.addEventListener("call_answered", async (e) => {
      const data = JSON.parse(e.data || "{}");
      if (data.call_id === _callId) {
        setCallStatus("상담원 응답 — 연결 중…");
        // 고객이 caller 로 offer 생성·전송
        await _startCallClient(_callId, true);
      }
    });
    _sse.addEventListener("call_signal", (e) => {
      const data = JSON.parse(e.data || "{}");
      if (_call) _call.handleSignal(data);
    });
    _sse.addEventListener("call_ended", (e) => {
      const data = JSON.parse(e.data || "{}");
      if (data.call_id === _callId) {
        if (_call) _call.cleanup();
        _call = null; _callId = null; _customerToken = null;
        setCallStatus("", false);
        const d = data.duration_seconds || 0;
        if (data.reason === "rejected") showNotice("상담원이 통화를 거절했습니다.");
        else showNotice(`☎ 통화 종료 (${Math.floor(d/60)}분 ${d%60}초)`);
      }
    });
    _sse.addEventListener("error", () => {
      _sseActive = false;
      startPolling();  // 폴링 주기를 빠른 모드(4초)로 복귀
    });
  } catch (e) { /* 미지원 — 기본 폴링 유지 */ }
}

// ===== 음성 상담 (Web Speech API + 서버 TTS) =====
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const TTS_OK = "speechSynthesis" in window;
let recognition = null;
let listening = false;
let gotSpeech = false;
let ttsEnabled = TTS_OK;
// 서버 TTS(Edge TTS) 가능 여부 — 가능하면 자연스러운 한국어 음성 사용,
// 불가능하면 브라우저 SpeechSynthesis 폴백.
let SERVER_TTS = null;  // null=미확인 / true / false
let _ttsAudio = null;   // 현재 재생 중인 <audio> (중복 재생 방지)

function showNotice(text) {
  const n = document.createElement("div");
  n.className = "notice";
  n.textContent = text;
  $("messages").appendChild(n);
  scrollDown();
}

// --- 음성 재생 (TTS): 봇·상담원 답변을 읽어준다 ---
//   1순위: 서버 TTS(/api/voice/tts) — Edge TTS 자연스러운 한국어
//   2순위: 브라우저 SpeechSynthesis (즉시 재생, 음질 OS 의존)
async function speak(text) {
  if (!ttsEnabled || !text) return;
  // 서버 가용성 미확인이면 한 번만 조회 (캐시)
  if (SERVER_TTS === null) {
    try {
      const r = await fetch(API + "/api/voice/tts/status");
      SERVER_TTS = r.ok ? !!(await r.json()).available : false;
    } catch (_) { SERVER_TTS = false; }
  }
  // 진행 중 재생 중단
  try { if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; } } catch (_) {}
  if (TTS_OK) { try { window.speechSynthesis.cancel(); } catch (_) {} }

  if (SERVER_TTS) {
    try {
      const r = await fetch(API + "/api/voice/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text.slice(0, 4000) }),
      });
      if (r.ok) {
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        _ttsAudio = audio;
        audio.onended = audio.onerror = () => URL.revokeObjectURL(url);
        await audio.play();
        return;
      }
    } catch (_) { /* 서버 실패 → 브라우저 폴백 */ }
  }
  // 폴백: 브라우저 TTS
  if (!TTS_OK) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    window.speechSynthesis.speak(u);
  } catch (e) { /* 무시 */ }
}
function warmUpTts() {
  if (!TTS_OK) return;
  try {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch (e) { /* 무시 */ }
}
function updateTtsBtn() {
  $("tts-btn").classList.toggle("off", !ttsEnabled);
  $("tts-btn").title = ttsEnabled ? "봇 음성 답변 끄기" : "봇 음성 답변 켜기";
}
function toggleTts() {
  ttsEnabled = !ttsEnabled;
  if (!ttsEnabled) {
    if (TTS_OK) { try { window.speechSynthesis.cancel(); } catch (_) {} }
    try { if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; } } catch (_) {}
  }
  updateTtsBtn();
}

// --- 음성 입력 (STT): 고객이 말하면 텍스트로 변환해 전송 ---
function updateMicBtn() {
  $("mic-btn").classList.toggle("listening", listening);
  $("msg-input").placeholder = listening ? "듣고 있어요…" : "메시지를 입력하세요";
}
function toggleMic() {
  if (!recognition) return;
  if (listening) { recognition.stop(); return; }
  if (TTS_OK) window.speechSynthesis.cancel(); // 봇 음성과의 에코 방지
  $("msg-input").value = "";
  try { recognition.start(); } catch (e) { /* 이미 시작됨 */ }
}
function setupVoice() {
  if (!TTS_OK) $("tts-btn").style.display = "none";
  else updateTtsBtn();

  if (!SpeechRec) {  // 음성 인식 미지원 브라우저 → 텍스트 입력만
    $("mic-btn").style.display = "none";
    return;
  }
  recognition = new SpeechRec();
  recognition.lang = "ko-KR";
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onstart = () => { listening = true; gotSpeech = false; updateMicBtn(); };
  recognition.onresult = (event) => {
    let transcript = "";
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    gotSpeech = true;
    $("msg-input").value = transcript;
  };
  recognition.onerror = (event) => {
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      showNotice("마이크 사용 권한이 필요합니다. 브라우저 설정을 확인해 주세요.");
    }
  };
  recognition.onend = () => {
    listening = false;
    updateMicBtn();
    if (gotSpeech && $("msg-input").value.trim()) sendMessage(); // 인식 종료 시 자동 전송
  };
}

// ===== 상담원 연결 / 상담 종료 =====
async function requestAgent() {
  if (!conversationId) return;
  try {
    const res = await fetch(API + `/api/conversations/${conversationId}/agent-request`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    if (!res.ok) throw new Error("실패");
    showNotice("상담원에게 연결 요청을 보냈습니다. 잠시만 기다려 주세요.");
    $("qa-agent").disabled = true;
    $("qa-agent").style.opacity = ".5";
  } catch (e) {
    showNotice("연결 요청 중 오류가 발생했습니다.");
  }
}

function openEndModal() {
  if (!conversationId) return;
  let rating = 0;
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h3>상담을 종료하시겠습니까?</h3>
      <p>오늘의 상담은 어떠셨나요? 평가를 남겨주시면 더 나은 서비스로 보답하겠습니다.</p>
      <div class="stars" id="end-stars">
        ${[1,2,3,4,5].map((n) => `<button data-r="${n}" aria-label="${n}점">★</button>`).join("")}
      </div>
      <textarea id="end-feedback" placeholder="개선 의견을 자유롭게 남겨주세요 (선택)" maxlength="500"></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="end-cancel">취소</button>
        <button class="btn-ok" id="end-ok">상담 종료</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const stars = backdrop.querySelectorAll("#end-stars button");
  stars.forEach((s) => {
    s.addEventListener("click", () => {
      rating = parseInt(s.dataset.r, 10);
      stars.forEach((b) => b.classList.toggle("on", parseInt(b.dataset.r, 10) <= rating));
    });
  });
  const close = () => backdrop.remove();
  backdrop.querySelector("#end-cancel").addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector("#end-ok").addEventListener("click", async () => {
    const okBtn = backdrop.querySelector("#end-ok");
    okBtn.disabled = true; okBtn.textContent = "종료 중…";
    const fb = backdrop.querySelector("#end-feedback").value.trim();
    const body = {};
    if (rating > 0) body.rating = rating;
    if (fb) body.feedback = fb;
    try {
      const res = await fetch(API + `/api/conversations/${conversationId}/end`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        let msg = "종료 처리에 실패했습니다.";
        try { const j = await res.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) {}
        throw new Error(msg);
      }
      close();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      $("composer").style.display = "none";
      $("quick-actions").style.display = "none";
      $("hint").textContent = "상담이 종료되었습니다. 이용해 주셔서 감사합니다.";
      showNotice("상담이 종료되었습니다. 평가를 남겨 주셔서 감사합니다.");
    } catch (e) {
      okBtn.disabled = false; okBtn.textContent = "상담 종료";
      showNotice(e.message || "종료 처리 중 오류가 발생했습니다.");
    }
  });
}

$("start-btn").addEventListener("click", startChat);
$("name-input").addEventListener("keydown", (e) => { if (e.key === "Enter") startChat(); });
$("send-btn").addEventListener("click", sendMessage);
$("msg-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
$("mic-btn").addEventListener("click", toggleMic);
$("tts-btn").addEventListener("click", toggleTts);
$("qa-agent").addEventListener("click", requestAgent);
$("qa-call").addEventListener("click", requestCall);
$("qa-callback").addEventListener("click", requestCallback);
$("qa-end").addEventListener("click", openEndModal);
$("call-hangup-btn").addEventListener("click", () => { if (_call) _call.hangup(); });

// --- WebRTC 통화 ---
let _call = null;
let _callId = null;
let _customerToken = null;  // /calls/request 응답으로 받는 1회용 권한 토큰

function setCallStatus(text, show = true, connected = false) {
  const bar = $("call-bar");
  bar.classList.toggle("shown", !!show);
  bar.classList.toggle("connected", !!connected);
  $("call-status").textContent = text;
}

async function requestCall() {
  if (!conversationId) { showNotice("상담을 먼저 시작해 주세요."); return; }
  if (_call) { showNotice("이미 통화 중입니다."); return; }
  if (!window.RTCPeerConnection) { showNotice("이 브라우저는 음성 통화를 지원하지 않습니다."); return; }
  try {
    const r = await fetch("/api/calls/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      showNotice("통화 요청 실패: " + (e.detail || r.status));
      return;
    }
    const call = await r.json();
    _callId = call.id;
    _customerToken = call.customer_token || null;
    setCallStatus("상담원 호출 중… 잠시만 기다려 주세요.");
    showNotice("☎ 통화 요청을 보냈습니다. 상담원이 받으면 연결됩니다.");
  } catch (e) {
    showNotice("통화 요청 중 오류: " + e.message);
  }
}

async function _startCallClient(callId, isCaller) {
  if (_call) return;
  _call = new CallClient({
    role: "customer",
    callId,
    conversationId,
    customerToken: _customerToken,
    onState: (s) => {
      if (s === "connecting") setCallStatus("연결 중…", true, false);
      else if (s === "connected") setCallStatus("☎ 통화 중", true, true);
      else if (s === "ended") {
        setCallStatus("", false);
        _call = null; _callId = null; _customerToken = null;
      }
    },
    onError: (e) => showNotice("통화 오류: " + e.message),
  });
  try {
    await _call.start({ isCaller });
  } catch (e) {
    _call = null; _callId = null;
    setCallStatus("", false);
  }
}

async function requestCallback() {
  const phone = (prompt("연락받을 전화번호를 입력해 주세요 (예: 010-1234-5678)") || "").trim();
  if (!phone) return;
  const preferred = (prompt("희망 통화 시간을 입력해 주세요 (예: 내일 오후 2시)\n비워두면 가능한 빨리 연락드립니다.") || "").trim();
  const note = (prompt("미리 알려둘 내용이 있으면 적어 주세요 (선택)") || "").trim();
  try {
    const res = await fetch(API + "/api/callbacks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phone, preferred_text: preferred || null, note: note || null,
        conversation_id: conversationId,
      }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showNotice(`콜백 예약 실패: ${err.detail || res.status}`);
      return;
    }
    showNotice("콜백 예약이 접수되었습니다. 영업일 기준 순차적으로 연락드립니다.");
  } catch (e) {
    showNotice("콜백 예약 중 오류가 발생했습니다.");
  }
}

setupVoice();
loadConfig();
loadBusinessStatus();
</script>
