<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학습 데이터 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  .controls {
    background: var(--c-surface);
    padding: var(--space-4) var(--space-6);
    border-bottom: 1px solid var(--c-border);
    position: sticky;
    top: 60px;
    z-index: 9;
  }
  .item {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-5);
    margin-bottom: var(--space-3);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .item:hover { border-color: var(--c-border-strong); box-shadow: var(--shadow-sm); }
  .item .head {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-2);
    flex-wrap: wrap;
  }
  .item .head .actions { margin-left: auto; display: flex; gap: 6px; }
  .item .src {
    font-size: var(--text-sm);
    color: var(--c-text-muted);
    margin-bottom: 6px;
  }
  .item .q {
    font-size: var(--text-base);
    color: var(--c-text);
    font-weight: var(--fw-bold);
    line-height: var(--leading-tight);
    margin: 4px 0;
  }
  .item .q::before { content: "Q. "; color: var(--c-brand-700); }
  .item .a {
    font-size: var(--text-base);
    color: var(--c-text-muted);
    line-height: var(--leading-base);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .item .a::before { content: "A. "; color: var(--c-success); font-weight: var(--fw-bold); }
  mark {
    background: var(--c-warning-bg);
    color: var(--c-warning);
    padding: 0 2px;
    border-radius: 3px;
  }
</style>
</head>
<body>
<header id="app-nav"></header>

<header class="page-header">
  <div>
    <div class="title">학습 데이터 관리</div>
    <div class="subtitle">종료된 상담에서 자동 학습된 (질문 → 답변) 지식</div>
  </div>
  <div class="meta">
    <span class="chip chip-brand" id="count-chip">·</span>
    <a class="btn btn-secondary btn-sm hidden" id="export-btn" href="/api/export/knowledge.csv" download>CSV</a>
  </div>
</header>

<div class="controls">
  <input class="input" id="search" placeholder="질문·답변·고객명으로 검색하세요" autocomplete="off" />
  <div class="stat-row" style="margin-top: var(--space-3); margin-bottom: 0">
    <div class="stat"><div class="label">총 항목</div><div class="value" id="s-total">0</div></div>
    <div class="stat"><div class="label">FAQ 노출</div><div class="value" id="s-visible">0</div></div>
    <div class="stat"><div class="label">FAQ 비노출 (짧음)</div><div class="value" id="s-hidden">0</div></div>
    <div class="stat"><div class="label">임베딩 보유</div><div class="value" id="s-emb">0</div></div>
  </div>
</div>

<div class="page-container">
  <div id="list"></div>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let allItems = [];
let searchText = "";

function highlight(text, query) {
  const safe = UI.escapeHtml(text);
  if (!query) return safe;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(escaped, "gi"), "<mark>$&</mark>");
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  } catch (e) { return iso; }
}

async function init() {
  try {
    const res = await fetch("/api/knowledge/items");
    if (!res.ok) throw new Error();
    allItems = await res.json();
  } catch (e) {
    $("list").innerHTML = emptyState("학습 데이터를 불러올 수 없습니다.", "잠시 후 다시 시도해 주세요.");
    return;
  }
  render();
}

function emptyState(title, desc) {
  return `<div class="empty-state">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></div>
    <div class="title">${UI.escapeHtml(title)}</div>
    <div class="desc">${UI.escapeHtml(desc)}</div>
  </div>`;
}

function render() {
  const q = searchText.trim().toLowerCase();
  const filtered = allItems.filter((it) => {
    if (!q) return true;
    return (
      (it.question || "").toLowerCase().includes(q) ||
      (it.answer || "").toLowerCase().includes(q) ||
      (it.customer_name || "").toLowerCase().includes(q)
    );
  });

  const total = allItems.length;
  const visible = allItems.filter((i) => i.faq_visible).length;
  const embedded = allItems.filter((i) => i.has_embedding).length;
  $("s-total").textContent = total;
  $("s-visible").textContent = visible;
  $("s-hidden").textContent = total - visible;
  $("s-emb").textContent = embedded;
  $("count-chip").textContent = `${total}건`;

  if (!total) {
    $("list").innerHTML = emptyState(
      "아직 학습된 상담이 없습니다",
      "상담원이 답변한 상담을 '종료' 상태로 바꾸면 자동으로 학습됩니다."
    );
    return;
  }
  if (!filtered.length) {
    $("list").innerHTML = emptyState("검색 결과가 없습니다", "다른 검색어를 입력해 보세요.");
    return;
  }

  $("list").innerHTML = filtered.map((it) => {
    const faqFlag = it.faq_visible
      ? '<span class="chip chip-success">FAQ 노출</span>'
      : '<span class="chip chip-neutral">FAQ 비노출 (짧음)</span>';
    const embFlag = it.has_embedding
      ? '<span class="chip chip-info">임베딩 ✓</span>'
      : '<span class="chip chip-neutral">임베딩 ✗</span>';
    return `
      <div class="item">
        <div class="head">
          <span class="chip chip-brand">#L${it.id}</span>
          <span class="faint" style="font-size:var(--text-xs)">학습 ${UI.escapeHtml(formatDate(it.created_at))}</span>
          ${faqFlag}${embFlag}
          <div class="actions">
            <button class="btn btn-secondary btn-xs" data-edit="${it.id}">수정</button>
            <button class="btn btn-danger btn-xs" data-del="${it.id}">삭제</button>
          </div>
        </div>
        <div class="src">출처: ${UI.escapeHtml(it.customer_name || "(이름 없음)")} ·
          <a href="/agent?conv=${it.conversation_id}">상담 #${it.conversation_id}</a>
          (${UI.escapeHtml(it.conversation_status || "-")})</div>
        <div class="q">${highlight(it.question || "", q)}</div>
        <div class="a">${highlight(it.answer || "", q)}</div>
      </div>`;
  }).join("");

  document.querySelectorAll("[data-edit]").forEach((b) => {
    b.addEventListener("click", () => editItem(parseInt(b.dataset.edit, 10)));
  });
  document.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", () => deleteItem(parseInt(b.dataset.del, 10)));
  });
}

async function editItem(id) {
  const it = allItems.find((x) => x.id === id);
  if (!it) return;
  const data = await UI.form({
    title: "학습 데이터 수정",
    description: `상담 #${it.conversation_id} 에서 학습된 항목을 수정합니다. 질문을 바꾸면 임베딩이 재계산됩니다.`,
    fields: [
      { name: "question", label: "질문", type: "textarea", value: it.question || "", required: true, rows: 2 },
      { name: "answer",   label: "답변", type: "textarea", value: it.answer || "",   required: true, rows: 5 },
    ],
    okText: "저장",
    wide: true,
  });
  if (!data) return;
  try {
    const res = await fetch(`/api/knowledge/items/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: data.question.trim(), answer: data.answer.trim() }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("수정했습니다.", { type: "success" });
    await init();
  } catch (e) {
    UI.toast(e?.detail || "수정 중 오류가 발생했습니다.", { type: "danger" });
  }
}

async function deleteItem(id) {
  const it = allItems.find((x) => x.id === id);
  const ok = await UI.confirm(
    `학습 항목 #L${id} 을(를) 삭제합니다.\n상담을 다시 '종료' 처리하면 재학습될 수 있습니다.`,
    { title: "학습 항목 삭제", okText: "삭제", danger: true }
  );
  if (!ok) return;
  try {
    const res = await fetch(`/api/knowledge/items/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("삭제 실패");
    UI.toast("삭제했습니다.", { type: "success" });
    await init();
  } catch (e) {
    UI.toast("삭제 중 오류가 발생했습니다.", { type: "danger" });
  }
}

$("search").addEventListener("input", (e) => {
  searchText = e.target.value;
  render();
});

document.addEventListener("auth-ready", (e) => {
  const user = e.detail;
  const perms = user?.permissions || [];
  if (user && (user.role === "admin" || perms.includes("data.export"))) {
    document.getElementById("export-btn").classList.remove("hidden");
  }
  init();
});
</script>
</body>
</html>
