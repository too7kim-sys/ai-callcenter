<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오프라인 · AI 콜센터</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f8fafc; color: #0f172a; margin: 0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    text-align: center; max-width: 360px;
    background: #fff; padding: 36px 28px; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, .08);
  }
  .icon { font-size: 56px; margin-bottom: 8px; }
  h1   { font-size: 20px; margin: 0 0 8px; }
  p    { color: #64748b; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: #1d4ed8; color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>오프라인 상태입니다</h1>
  <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요.<br>
     PWA 로 설치된 콜센터의 UI 셸은 캐시에서 로드됐습니다.</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
</body>
</html>
