<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>답변 템플릿 · AI 콜센터</title>
<link rel="stylesheet" href="/assets/ui.css" />
<link rel="stylesheet" href="/assets/nav.css" />
<style>
  .tpl { transition: border-color var(--transition-fast); }
  .tpl:hover { border-color: var(--c-border-strong); }
  .tpl-content { font-size: var(--text-sm); color: var(--c-text-muted); white-space: pre-wrap; word-break: break-word; line-height: var(--leading-base); }
</style>
<script src="/assets/pwa.js" defer></script>
</head>
<body>
<header id="app-nav"></header>

<header class="page-header">
  <div>
    <div class="title">답변 템플릿</div>
    <div class="subtitle">상담원이 자주 쓰는 답변을 미리 등록해 두면 1클릭으로 삽입됩니다.</div>
  </div>
  <div class="meta">
    <span class="chip" id="count">·</span>
    <button class="btn btn-primary btn-sm hidden" id="add-btn">+ 템플릿 추가</button>
  </div>
</header>

<div class="page-container">
  <div id="list"></div>
</div>

<script src="/assets/ui.js"></script>
<script src="/assets/nav.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let canManage = false;
let templates = [];

async function load() {
  try {
    templates = await (await fetch("/api/templates")).json();
  } catch (e) {
    $("list").innerHTML = `<div class="empty-state"><div class="title">템플릿을 불러올 수 없습니다</div></div>`;
    return;
  }
  $("count").textContent = `${templates.length}건`;
  render();
}

function render() {
  if (!templates.length) {
    $("list").innerHTML = `<div class="empty-state">
      <div class="title">등록된 템플릿이 없습니다</div>
      <div class="desc">'+ 템플릿 추가' 로 자주 쓰는 답변을 등록해 두세요.</div>
    </div>`;
    return;
  }
  $("list").innerHTML = templates.map((t) => `
    <div class="card tpl" style="margin-bottom: var(--space-3)">
      <div class="card-head">
        <div>
          <div class="title">${UI.escapeHtml(t.title)}</div>
          ${t.category ? `<div style="margin-top:4px"><span class="chip">${UI.escapeHtml(t.category)}</span></div>` : ""}
        </div>
        ${canManage ? `<div style="display:flex;gap:4px">
          <button class="btn btn-secondary btn-xs" data-edit="${t.id}">수정</button>
          <button class="btn btn-danger btn-xs" data-del="${t.id}">삭제</button>
        </div>` : ""}
      </div>
      <div class="card-body">
        <div class="tpl-content">${UI.escapeHtml(t.content)}</div>
      </div>
    </div>
  `).join("");

  document.querySelectorAll("[data-edit]").forEach((b) => {
    b.addEventListener("click", () => editTpl(parseInt(b.dataset.edit, 10)));
  });
  document.querySelectorAll("[data-del]").forEach((b) => {
    b.addEventListener("click", () => delTpl(parseInt(b.dataset.del, 10)));
  });
}

async function addTpl() {
  const data = await UI.form({
    title: "템플릿 추가",
    fields: [
      { name: "title", label: "제목", required: true, maxLength: 100 },
      { name: "category", label: "카테고리 (선택)", maxLength: 64,
        placeholder: "예: 환불, 비밀번호, 인사" },
      { name: "content", label: "내용", type: "textarea", required: true, rows: 5,
        placeholder: "고객에게 보낼 답변 본문" },
    ],
    okText: "추가",
    wide: true,
  });
  if (!data) return;
  try {
    const res = await fetch("/api/templates", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: data.title.trim(),
        category: data.category.trim(),
        content: data.content.trim(),
      }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("템플릿을 추가했습니다.", { type: "success" });
    await load();
  } catch (e) {
    UI.toast(e?.detail || "추가에 실패했습니다.", { type: "danger" });
  }
}

async function editTpl(id) {
  const t = templates.find((x) => x.id === id);
  if (!t) return;
  const data = await UI.form({
    title: "템플릿 수정",
    fields: [
      { name: "title", label: "제목", value: t.title, required: true, maxLength: 100 },
      { name: "category", label: "카테고리", value: t.category || "", maxLength: 64 },
      { name: "content", label: "내용", type: "textarea", value: t.content, required: true, rows: 5 },
    ],
    okText: "저장",
    wide: true,
  });
  if (!data) return;
  try {
    const res = await fetch(`/api/templates/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: data.title.trim(),
        category: data.category.trim(),
        content: data.content.trim(),
      }),
    });
    if (!res.ok) throw await res.json();
    UI.toast("수정했습니다.", { type: "success" });
    await load();
  } catch (e) {
    UI.toast(e?.detail || "수정에 실패했습니다.", { type: "danger" });
  }
}

async function delTpl(id) {
  const t = templates.find((x) => x.id === id);
  const ok = await UI.confirm(`템플릿 '${t ? t.title : id}' 을(를) 삭제합니다.`,
    { title: "템플릿 삭제", okText: "삭제", danger: true });
  if (!ok) return;
  try {
    const res = await fetch(`/api/templates/${id}`, { method: "DELETE" });
    if (!res.ok) throw await res.json();
    UI.toast("삭제했습니다.", { type: "success" });
    await load();
  } catch (e) {
    UI.toast(e?.detail || "삭제에 실패했습니다.", { type: "danger" });
  }
}

$("add-btn").addEventListener("click", addTpl);

document.addEventListener("auth-ready", (e) => {
  const user = e.detail;
  canManage = user && (user.role === "admin" || (user.permissions || []).includes("template.manage"));
  if (canManage) $("add-btn").classList.remove("hidden");
  load();
});
</script>
</body>
</html>
